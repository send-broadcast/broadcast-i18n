# The signed-in admin interface, in English.
#
# One file per language (admin.<locale>.yml); the languages offered are
# User::LOCALES. Every key here must exist in every other admin.<locale>.yml,
# which AdminTranslationsTest enforces.
#
# Views use lazy lookup, so a key's path is the view's path:
# t('.subscribers') in layouts/sidebar/_icon_rail.html.erb reads
# layouts.sidebar.icon_rail.subscribers.
#
# The pages subscribers see are NOT here. They speak the channel's language and
# live in unsubscribes/confirmations/opt_ins.<locale>.yml (PublicPageLanguages).
#
# Conventions
#   * Top-level blocks are kept in alphabetical order (view directories, plus
#     activerecord, common, date, enums, helpers, time).
#   * Controllers use lazy lookup too: t('.created') in BroadcastsController#create
#     reads broadcasts.create.created. A title the controller sets (@title) is
#     page_title, never title: the action's view usually has a title key of its
#     own under the same path. Keys for a page title or breadcrumb shared by
#     several actions use the absolute key of the action that owns the page.
#   * common holds only words that read the same in every context (Save, Cancel,
#     Delete). Anything whose translation depends on what it describes (New,
#     Active, None) gets its own key next to the view that uses it.
#   * Text containing markup: a key ending in _html, with links passed in as
#     interpolations (t('.intro_html', link: link_to(t('.intro_link'), path))).
#   * Counts: one/other keys and count:. Dates and times: l(value, format: :medium)
#     with the formats under date.formats and time.formats below. In English:
#       date medium "Jan 5, 2026", date long_day "January 5, 2026",
#       time medium "Jan 5, 2026 at 3:04 PM", full "January 5, 2026 at 3:04 PM",
#       full_zone "... 3:04 PM EST", day_clock "Jan 5 at 3:04 PM", clock "3:04 PM".
#     Italian puts the day first and uses the 24-hour clock ("5 gen 2026 alle 15:04").
#   * Enum values: human_enum(record, :status), reading enums.<model>.<attribute>.
#   * JavaScript reads js.* through t() in app/javascript/lib/i18n.js (the layout
#     embeds js.* for the user's language): t('autosave.saving') reads
#     js.autosave.saving. tHtml() escapes the values for strings that become HTML.
#   * Validation messages are symbols: errors.add(:field, :key) reads
#     activerecord.errors.models.<model>.attributes.<field>.<key> (shared
#     concerns: activerecord.errors.messages.<key>), named via activerecord.attributes.
#   * Text built outside a request (jobs, mail, cable broadcasts) takes the
#     language of the person it is for: the recipient's for mail, the starter's
#     for a run's log. When everyone watching a page receives it, send a key and
#     values (message_key, status_key) and let each browser word it.
