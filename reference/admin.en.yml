        examples: "Showing up to 20 examples."
        confirm_additive: "You will be asked to confirm, since this adds to the global list for every channel."
        confirm_rewrite: "You will be asked to confirm, since this cannot be undone."
        needs_hint_title: "Left alone: the order is not knowable"
        needs_hint_body_html: "These fields hold dates like <code>01/02/2026</code>, where nothing in the data says whether that is 1 February or 2 January, and no other value in the field settles it. Guessing would move every one of them by a month."
        conflicting_title: "Left alone: two formats in one field"
        conflicting_body: "These fields contain both day-first and month-first dates, so no single reading is right for all of them. Re-importing the column with its format declared is the way out."
        uncertain_title: "Left alone: more than one possible answer"
        uncertain_body: "These were not changed because the right value was not certain. Decide each one yourself rather than have the repair guess."
        collision_title: "Left alone: would collide with another subscriber"
        collision_body: "Tidying these addresses would produce one that another subscriber already has. Merging two real records is a separate decision, so they were skipped."
        back: "← Back to Maintenance"
      tasks:
        custom_data_dates:
          title: "Repair dates in custom fields"
          description: "Rewrites dates stored in custom fields as ISO (2026-01-24) wherever there is only one possible reading: extra spaces, missing zeros, year-first formats, named months, and day/month values that prove their own order. Segment rules can only compare dates written this way."
        segment_rule_values:
          title: "Repair dates typed into segment rules"
          description: "A rule comparing against a date like 24/01/2026 matches nobody and says nothing about why. This rewrites those values as ISO."
        subscriber_emails:
          title: "Tidy subscriber email addresses"
          description: "Trims stray spaces and lowercases addresses so lookups and imports stop missing them. Where tidying reveals the same address twice, the untidy copy is deactivated so the person is not counted (or mailed) twice; nothing is deleted, and its history says which subscriber it duplicates. Only affects records written before addresses were tidied automatically, so most channels will find nothing."
        whitespace:
          title: "Trim stray spaces from subscriber data"
          description: "Removes leading and trailing whitespace from names and custom field values. A value with a space in front of it will not match a segment rule looking for it."
        suppression_promotion:
          title: "Copy this channel’s suppressions to the global list"
          description: "An address that bounced or complained in this channel is still mailed when the same person appears in another one, which costs sending reputation. This copies every address on this channel’s suppression list onto the global list, so they are blocked everywhere. The channel’s own list is kept, and running it again adds nothing."
        postmark_server_names:
          title: "Repair Postmark server names"
          description: "Earlier versions sent Postmark a server name with \"Postmark - \" in front of it, and added another prefix every time setup was re-run, so servers ended up named \"Postmark - Postmark - Acme\". This renames them in Postmark to match the name shown here. A server whose Postmark name differs for any other reason may have been renamed there on purpose, so it is reported rather than changed. Most installations will find nothing."
