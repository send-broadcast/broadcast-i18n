    autopilot_presets:
      tech:
        tone: "Technical and informative, but accessible. Use clear language to explain complex topics. Include code snippets or technical details where relevant. Keep a professional yet approachable voice that developers appreciate."
        content: "Focus on: new releases, breaking changes, security updates, performance improvements, and developer tools. Prioritize actionable information. Include links to documentation and relevant resources."
        structure: "## 🚀 What's New\n\n{new_releases}\n\n## ⚠️ Breaking Changes\n\n{breaking_changes}\n\n## 🔧 Bug Fixes & Improvements\n\n{fixes}\n\n## 📚 Worth Reading\n\n{articles}\n\n## 📅 Upcoming\n\n{upcoming}"
      company:
        tone: "Professional, warm, and confident. Speak as a trusted partner sharing updates. Balance being informative with being personable. Avoid corporate jargon - be human and authentic."
        content: "Highlight company milestones, product updates, team news, and customer success stories. Lead with the most impactful news. Include clear calls-to-action where appropriate."
        structure: "## Hello from the Team\n\n{intro}\n\n## Product Updates\n\n{updates}\n\n## Company News\n\n{news}\n\n## Customer Spotlight\n\n{spotlight}\n\n## What's Coming Next\n\n{roadmap}"
      community:
        tone: "Friendly, enthusiastic, and inclusive. Celebrate community contributions and foster connection. Use conversational language and occasional humor. Make readers feel like valued members of the community."
        content: "Showcase community contributions, highlight member achievements, share upcoming events, and encourage participation. Feature diverse voices and perspectives from the community."
        structure: "## 👋 Hey Community!\n\n{greeting}\n\n## 🌟 Community Highlights\n\n{highlights}\n\n## 🎉 Member Spotlight\n\n{spotlight}\n\n## 📆 Upcoming Events\n\n{events}\n\n## 💬 Discussion of the Week\n\n{discussion}\n\n## 🙌 Get Involved\n\n{cta}"
      changelog:
        tone: "Clear, concise, and factual. Focus on what changed and why it matters to users. Use bullet points for easy scanning. Be direct about both improvements and known issues."
        content: "Organize by: new features, improvements, bug fixes, and deprecations. Include version numbers where applicable. Link to detailed documentation for complex changes."
        structure: "## Version {version} - {date}\n\n### ✨ New Features\n\n{features}\n\n### 🔄 Improvements\n\n{improvements}\n\n### 🐛 Bug Fixes\n\n{fixes}\n\n### ⚠️ Deprecations\n\n{deprecations}\n\n### 📝 Notes\n\n{notes}"
      curated:
        tone: "Thoughtful and opinionated, like a knowledgeable friend sharing finds. Provide brief but insightful commentary on each link. Be selective - quality over quantity."
        content: "Curate the most interesting and valuable links. Group by theme or category. Add personal commentary explaining why each link is worth reading. Include a mix of articles, tools, and resources."
        structure: "## This Week's Picks\n\n{intro}\n\n### 📖 Must Read\n\n{must_read}\n\n### 🛠 Tools & Resources\n\n{tools}\n\n### 💡 Ideas & Inspiration\n\n{ideas}\n\n### 🎯 Quick Links\n\n{quick_links}\n\n---\n\n*Found something great? Reply to share it!*"
      industry:
