        label: "Sua própria API"
        description: "Adiciona endereços de API que podem ser usados por quem tem um token de API correspondente."
      events_webhook:
        label: "Seus eventos em webhooks"
        description: "Permite enviar eventos deste plugin para os seus endpoints de webhook. Nada é enviado até você ativar um evento para um endpoint. Um webhook contém o evento, os campos declarados dele e o id do assinante, nunca um endereço de e-mail."
      hooks_publicActions:
        label: "Links em e-mails que qualquer pessoa pode clicar"
