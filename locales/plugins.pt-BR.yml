# Broadcast plugins: plugin screens, permissions and emails, Portuguese (Brazil).
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.pt-BR.yml. bin/check validates the
# file; see CONTRIBUTING.md.
pt-BR:
  plugins:
    open_link:
      title: "Abrir este link?"
      body: "%{plugin} quer abrir uma página fora do Broadcast. Confira o endereço antes de continuar."
