        label: "Acesso a um endereço privado"
        description: "Conecta-se a um endereço da sua rede privada que você aprova."
      email_sender:
        label: "Alterar o remetente"
        description: "Altera De ou Responder para para um remetente verificado neste canal."
      sql:
        label: "Acesso ao banco de dados"
      files:
        label: "Acesso a arquivos"
      env:
        label: "Acesso às configurações do servidor"
      process:
        label: "Iniciar programas"
      subscribers_resubscribe:
        label: "Inscrever pessoas novamente"
      suppressions_write:
        label: "Remover supressões"
      email_recipients:
        label: "Alterar destinatários de e-mails"
      email_unsubscribe:
        label: "Alterar o link de cancelamento da inscrição"
