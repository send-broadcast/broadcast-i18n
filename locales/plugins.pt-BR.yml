    permissions:
      settings:
        label: "Suas próprias configurações"
        description: "Lê as configurações que você informa para este plugin, incluindo valores secretos."
      store:
        label: "Seu próprio armazenamento"
        description: "Guarda os próprios dados no Broadcast."
      log:
        label: "Logs"
        description: "Escreve linhas de log que você pode ler na página do plugin."
      channel:
        label: "Nome do canal"
        description: "Lê o nome do canal em que é executado."
      events:
        label: "Seus próprios eventos"
        description: "Registra eventos (por exemplo, pedidos) para as suas regras de segmento."
      subscribers_read:
        label: "Ler assinantes"
        description: "Lê os dados, tags e campos personalizados dos assinantes."
      subscribers_write:
        label: "Alterar assinantes"
        description: "Altera nomes, campos personalizados e outros dados de assinantes existentes."
      tags_read:
        label: "Ler tags"
        description: "Lê a lista de tags."
      tags_write:
        label: "Alterar tags"
        description: "Adiciona tags aos assinantes e as remove."
      broadcasts_read:
        label: "Ler campanhas"
        description: "Lê as campanhas e as suas estatísticas."
      sequences_read:
        label: "Ler sequências"
        description: "Lê as sequências e as suas etapas."
      segments_read:
        label: "Ler segmentos"
        description: "Lê os segmentos e as suas regras."
      network:
        label: "Acesso à internet"
        description: "Conecta-se a estes sites: %{hosts}."
      subscribers_export:
        label: "Copiar a sua lista inteira"
        description: "Pode ler todos os assinantes, página por página, e enviá-los para %{hosts}."
      subscribers_create:
        label: "Adicionar novos assinantes"
        description: "Adiciona pessoas à sua lista. A sua configuração de opt-in duplo é aplicada."
      network_wildcard:
        label: "Acesso à internet a muitos sites"
        description: "Conecta-se a qualquer site que corresponda a %{hosts}."
      network_fromSetting:
        label: "Acesso à internet a um endereço que você informa"
        description: "Conecta-se ao endereço que você digita na configuração %{setting}."
      output_html:
        label: "HTML nos e-mails"
        description: "Adiciona HTML aos e-mails. O Broadcast o limpa antes do envio."
      hooks_beforeSend:
        label: "Alterar e-mails antes do envio"
        description: "Pode pular um e-mail ou alterar o assunto e o conteúdo dele. Não pode alterar quem o recebe, o remetente nem o link de cancelamento da inscrição."
