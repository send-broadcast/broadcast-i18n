      label: "Desenvolvedor de plugins"
      hint: "Para um agente de IA que escreve plugins: ele pode criar, alterar e testar rascunhos com dados de teste e enviá-los para a sua revisão. Ele não pode ler dados reais de assinantes nem implantar. Ele não pode ter outras permissões e expira em até 30 dias."
    webhook_endpoints:
      title: "Eventos de plugins"
      hint: "Enviados apenas para os eventos que você marcar aqui. Selecionar todos não os inclui."
      not_available: "tem um evento de plugin que não está disponível neste canal"
