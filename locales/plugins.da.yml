# Broadcast plugins: plugin screens, permissions and emails, Danish.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.da.yml. bin/check validates the
# file; see CONTRIBUTING.md.
da:
  plugins:
    open_link:
      title: "Vil du åbne dette link?"
      body: "%{plugin} vil åbne en side uden for Broadcast. Tjek adressen, før du fortsætter."
      open: "Åbn link"
    editor_insert:
      close: "Luk"
      from: "Fra %{plugin}"
      cleaned: "Broadcast kontrollerer og renser HTML-koden, før den kommer ind i e-mailen."
      group: "Fra plugins"
      menu: "Indsæt fra et plugin"
    public_action:
      confirm_title: "Et øjeblik"
      confirm_button: "Fortsæt"
      saving: "Gemmer…"
      done_title: "Tak"
      own_answer: "Dit svar"
      form_submit: "Send"
      copy_button: "Kopiér"
      copied: "Kopieret"
      failed_title: "Noget gik galt"
      failed_body: "Vi kunne ikke gemme dette. Prøv linket igen senere."
      test_title: "Dette er en test-e-mail"
      test_body: "Linket virker. I den rigtige e-mail gemmes dette klik for den person, der klikker. Intet blev gemt nu."
    developer_token:
      label: "Plugin-udvikler"
      hint: "Til en AI-agent, der skriver plugins: den kan oprette, ændre og teste kladder med testdata og sende dem til dig til gennemgang. Den kan ikke læse rigtige abonnentdata eller udrulle. Den kan ikke have andre tilladelser og udløber inden for 30 dage."
    webhook_endpoints:
      title: "Plugin-hændelser"
      hint: "Sendes kun for de hændelser, du sætter flueben ved her. Vælg alle medtager dem ikke."
      not_available: "har en plugin-hændelse, der ikke er tilgængelig i denne kanal"
    token_endpoints:
      label: "Plugin-endpoints"
      hint: "De plugin-API-endpoints, dette token må kalde, ét pr. linje (plugin/endpoint, eller plugin/* for alle). Tokenet skal også have den tilladelse, hvert endpoint kræver."
      needs: "kræver %{permission}"
    permissions:
      settings:
        label: "Egne indstillinger"
        description: "Læser de indstillinger, du angiver for dette plugin, også hemmelige værdier."
      store:
        label: "Eget lager"
        description: "Gemmer sine egne data i Broadcast."
      log:
        label: "Logs"
        description: "Skriver loglinjer, som du kan læse på pluginets side."
      channel:
        label: "Kanalnavn"
        description: "Læser navnet på den kanal, det kører i."
      events:
        label: "Egne hændelser"
        description: "Registrerer hændelser (for eksempel ordrer) til sine segmentregler."
      subscribers_read:
        label: "Læse abonnenter"
        description: "Læser abonnentoplysninger, tags og brugerdefinerede felter."
      subscribers_write:
        label: "Ændre abonnenter"
        description: "Ændrer navne, brugerdefinerede felter og andre oplysninger om eksisterende abonnenter."
      tags_read:
        label: "Læse tags"
        description: "Læser listen over tags."
      tags_write:
        label: "Ændre tags"
        description: "Tilføjer tags til abonnenter og fjerner dem."
      broadcasts_read:
        label: "Læse kampagner"
        description: "Læser kampagner og deres statistik."
      sequences_read:
        label: "Læse sekvenser"
        description: "Læser sekvenser og deres trin."
      segments_read:
        label: "Læse segmenter"
        description: "Læser segmenter og deres regler."
      templates_read:
        label: "Læse skabeloner"
        description: "Læser navnene, emnelinjerne og de første ord i dine e-mailskabeloner."
      emails_send:
        label: "Sende dine e-mailskabeloner"
        description: "Sender en af dine e-mailskabeloner til én abonnent i denne kanal, som transaktionsmail. Den sender aldrig til en person, der er afmeldt eller inaktiv, og den har en grænse pr. time."
      network:
        label: "Internetadgang"
        description: "Forbinder til disse websteder: %{hosts}."
      subscribers_export:
        label: "Kopiere hele din liste"
        description: "Kan læse alle abonnenter, side for side, og sende dem til %{hosts}."
      subscribers_create:
        label: "Tilføje nye abonnenter"
        description: "Tilføjer personer til din liste. Din indstilling for dobbelt opt-in gælder."
      network_wildcard:
        label: "Internetadgang til mange websteder"
        description: "Forbinder til ethvert websted, der matcher %{hosts}."
      network_fromSetting:
        label: "Internetadgang til en adresse, du angiver"
        description: "Forbinder til den adresse, du skriver i indstillingen %{setting}."
      output_html:
        label: "HTML i e-mails"
        description: "Tilføjer HTML til e-mails. Broadcast renser det, før det sendes."
      hooks_beforeSend:
        label: "Ændre e-mails, før de sendes"
        description: "Kan springe en e-mail over eller ændre dens emne og indhold. Det kan ikke ændre, hvem der modtager den, afsenderen eller afmeldingslinket."
      hooks_apiEndpoints:
        label: "Eget API"
        description: "Tilføjer API-adresser, som kaldere med et matchende API-token kan bruge."
      events_webhook:
        label: "Egne hændelser i webhooks"
        description: "Lader dig sende hændelser fra dette plugin til dine webhook-endpoints. Intet sendes, før du slår en hændelse til for et endpoint. En webhook indeholder hændelsen, dens deklarerede felter og abonnentens id, aldrig en e-mailadresse."
      hooks_publicActions:
        label: "Links i e-mails, som alle kan klikke på"
        description: "Tilføjer links til e-mails, der kører dette plugin, når en abonnent klikker på dem, uden login. Broadcast beviser, hvem der klikkede. Pluginet får abonnenten og valget i linket."
      network_private:
        label: "Adgang til én privat adresse"
        description: "Forbinder til én adresse på dit private netværk, som du godkender."
      email_sender:
        label: "Ændre afsenderen"
        description: "Ændrer Fra eller Svar til til en afsender, der er verificeret i denne kanal."
      sql:
        label: "Databaseadgang"
      files:
        label: "Filadgang"
      env:
        label: "Adgang til serverindstillinger"
      process:
        label: "Starte programmer"
      subscribers_resubscribe:
