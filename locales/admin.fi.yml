        needs_hint_body_html: "Näissä kentissä on päivämääriä kuten <code>01/02/2026</code>, joissa mikään tiedoissa ei kerro, onko kyseessä 1. helmikuuta vai 2. tammikuuta, eikä mikään muu kentän arvo ratkaise asiaa. Arvaaminen siirtäisi jokaista niistä kuukaudella."
        conflicting_title: "Jätetty ennalleen: kaksi muotoa samassa kentässä"
        conflicting_body: "Näissä kentissä on sekä päivä edellä että kuukausi edellä kirjoitettuja päivämääriä, joten mikään yksittäinen tulkinta ei ole oikea kaikille. Ratkaisu on tuoda sarake uudelleen ja ilmoittaa sen muoto."
        uncertain_title: "Jätetty ennalleen: useampi kuin yksi mahdollinen vastaus"
        uncertain_body: "Näitä ei muutettu, koska oikeasta arvosta ei ollut varmuutta. Päätä kustakin itse sen sijaan, että korjaus arvaisi."
        collision_title: "Jätetty ennalleen: törmäisi toiseen tilaajaan"
        collision_body: "Näiden osoitteiden siistiminen tuottaisi osoitteen, joka on jo toisella tilaajalla. Kahden todellisen tietueen yhdistäminen on erillinen päätös, joten ne ohitettiin."
        back: "← Takaisin ylläpitoon"
      tasks:
        custom_data_dates:
          title: "Korjaa mukautettujen kenttien päivämäärät"
          description: "Kirjoittaa mukautettuihin kenttiin tallennetut päivämäärät ISO-muotoon (2026-01-24) aina, kun tulkintoja on vain yksi: ylimääräiset välilyönnit, puuttuvat nollat, vuosi edellä -muodot, kuukausien nimet sekä päivä/kuukausi-arvot, joista järjestys selviää. Segmenttisäännöt voivat verrata vain tässä muodossa kirjoitettuja päivämääriä."
        segment_rule_values:
          title: "Korjaa segmenttisääntöihin kirjoitetut päivämäärät"
          description: "Sääntö, joka vertaa päivämäärään kuten 24/01/2026, ei vastaa ketään eikä kerro miksi. Tämä kirjoittaa nämä arvot ISO-muotoon."
        subscriber_emails:
          title: "Siisti tilaajien sähköpostiosoitteet"
          description: "Poistaa ylimääräiset välilyönnit ja muuttaa osoitteet pieniksi kirjaimiksi, jotta haut ja tuonnit löytävät ne. Jos siistiminen paljastaa saman osoitteen kahdesti, siistimätön kopio poistetaan käytöstä, jotta henkilöä ei lasketa (tai hänelle lähetetä postia) kahdesti; mitään ei poisteta, ja sen historiasta näkee, minkä tilaajan kaksoiskappale se on. Koskee vain tietueita, jotka on kirjoitettu ennen osoitteiden automaattista siistimistä, joten useimmilla kanavilla ei löydy mitään."
        whitespace:
          title: "Poista ylimääräiset välilyönnit tilaajatiedoista"
          description: "Poistaa nimien ja mukautettujen kenttien arvojen alussa ja lopussa olevat välilyönnit. Arvo, jonka edessä on välilyönti, ei vastaa sitä etsivää segmenttisääntöä."
        suppression_promotion:
          title: "Kopioi tämän kanavan estot yleiselle listalle"
          description: "Osoitteeseen, joka palautui tai valitti tällä kanavalla, lähetetään edelleen postia, kun sama henkilö on toisella kanavalla, mikä heikentää lähettäjämainetta. Tämä kopioi jokaisen tämän kanavan estolistan osoitteen yleiselle listalle, jolloin ne estetään kaikkialla. Kanavan oma lista säilyy, eikä uudelleen suorittaminen lisää mitään."
        postmark_server_names:
          title: "Korjaa Postmark-palvelinten nimet"
          description: "Aiemmat versiot lähettivät Postmarkille palvelimen nimen, jonka edessä oli \"Postmark - \", ja lisäsivät uuden etuliitteen aina, kun määritys suoritettiin uudelleen, joten palvelinten nimiksi tuli esimerkiksi \"Postmark - Postmark - Acme\". Tämä nimeää ne Postmarkissa uudelleen vastaamaan täällä näkyvää nimeä. Palvelin, jonka Postmark-nimi poikkeaa jostain muusta syystä, on voitu nimetä siellä uudelleen tarkoituksella, joten se raportoidaan muuttamisen sijaan. Useimmissa asennuksissa ei löydy mitään."
