    autopilot_presets:
      tech:
        tone: "Tekninen ja informatiivinen mutta helposti lähestyttävä. Selitä monimutkaiset aiheet selkeällä kielellä. Lisää koodiesimerkkejä tai teknisiä yksityiskohtia, kun ne ovat olennaisia. Pidä ääni ammattimaisena mutta helposti lähestyttävänä, mitä kehittäjät arvostavat."
        content: "Keskity uusiin julkaisuihin, yhteensopivuutta rikkoviin muutoksiin, tietoturvapäivityksiin, suorituskykyparannuksiin ja kehitystyökaluihin. Nosta toimintaan ohjaava tieto etusijalle. Lisää linkkejä dokumentaatioon ja muihin olennaisiin lähteisiin."
        structure: "## 🚀 Mitä uutta\n\n{new_releases}\n\n## ⚠️ Yhteensopivuutta rikkovat muutokset\n\n{breaking_changes}\n\n## 🔧 Korjaukset ja parannukset\n\n{fixes}\n\n## 📚 Lukemisen arvoista\n\n{articles}\n\n## 📅 Tulossa\n\n{upcoming}"
      company:
        tone: "Ammattimainen, lämmin ja itsevarma. Puhu kuin luotettu kumppani, joka kertoo uutisista. Tasapainota informatiivisuus ja persoonallisuus. Vältä yritysjargonia ja ole inhimillinen ja aito."
        content: "Nosta esiin yrityksen virstanpylväät, tuotepäivitykset, tiimiuutiset ja asiakkaiden menestystarinat. Aloita merkittävimmästä uutisesta. Lisää selkeät toimintakehotukset, kun se on tarkoituksenmukaista."
        structure: "## Terveisiä tiimiltä\n\n{intro}\n\n## Tuotepäivitykset\n\n{updates}\n\n## Yritysuutiset\n\n{news}\n\n## Asiakas valokeilassa\n\n{spotlight}\n\n## Mitä seuraavaksi\n\n{roadmap}"
      community:
        tone: "Ystävällinen, innostunut ja kaikki mukaan ottava. Juhlista yhteisön panosta ja vahvista yhteyttä. Käytä keskustelevaa kieltä ja ripaus huumoria. Saa lukijat tuntemaan itsensä yhteisön arvostetuiksi jäseniksi."
        content: "Esittele yhteisön panoksia, nosta esiin jäsenten saavutuksia, kerro tulevista tapahtumista ja kannusta osallistumaan. Tuo esiin yhteisön monipuolisia ääniä ja näkökulmia."
        structure: "## 👋 Hei yhteisö!\n\n{greeting}\n\n## 🌟 Yhteisön kohokohdat\n\n{highlights}\n\n## 🎉 Jäsen valokeilassa\n\n{spotlight}\n\n## 📆 Tulevat tapahtumat\n\n{events}\n\n## 💬 Viikon keskustelu\n\n{discussion}\n\n## 🙌 Lähde mukaan\n\n{cta}"
      changelog:
        tone: "Selkeä, ytimekäs ja asiallinen. Keskity siihen, mikä muuttui ja miksi sillä on merkitystä käyttäjille. Käytä luettelomerkkejä helpottamaan silmäilyä. Kerro suoraan sekä parannuksista että tunnetuista ongelmista."
        content: "Järjestä näin: uudet ominaisuudet, parannukset, virhekorjaukset ja käytöstä poistuvat ominaisuudet. Lisää versionumerot, kun ne ovat saatavilla. Linkitä monimutkaisten muutosten kohdalla yksityiskohtaiseen dokumentaatioon."
        structure: "## Versio {version}, {date}\n\n### ✨ Uudet ominaisuudet\n\n{features}\n\n### 🔄 Parannukset\n\n{improvements}\n\n### 🐛 Virhekorjaukset\n\n{fixes}\n\n### ⚠️ Käytöstä poistuvat\n\n{deprecations}\n\n### 📝 Huomiot\n\n{notes}"
      curated:
        tone: "Harkittu ja mielipiteellinen, kuin asiantunteva ystävä, joka jakaa löytöjään. Kirjoita jokaisesta linkistä lyhyt mutta oivaltava kommentti. Ole valikoiva: laatu ennen määrää."
        content: "Valitse kiinnostavimmat ja arvokkaimmat linkit. Ryhmittele teeman tai luokan mukaan. Lisää henkilökohtainen kommentti siitä, miksi kukin linkki on lukemisen arvoinen. Ota mukaan artikkeleita, työkaluja ja resursseja."
        structure: "## Viikon poiminnat\n\n{intro}\n\n### 📖 Pakko lukea\n\n{must_read}\n\n### 🛠 Työkalut ja resurssit\n\n{tools}\n\n### 💡 Ideoita ja inspiraatiota\n\n{ideas}\n\n### 🎯 Pikalinkit\n\n{quick_links}\n\n---\n\n*Löysitkö jotain hienoa? Jaa se vastaamalla!*"
      industry:
        tone: "Asiantunteva mutta helposti lähestyttävä. Tarjoa analyysia ja taustaa, ei pelkkiä uutisia. Auta lukijoita ymmärtämään, miksi kehityskuluilla on merkitystä. Tasapainota syvyys ja luettavuus."
        content: "Käsittele alan tärkeimpiä uutisia, trendejä ja analyyseja. Kerro taustat ja vaikutukset. Lisää asiantuntijoiden näkemyksiä ja dataa, kun niitä on saatavilla. Yhdistä eri kehityskulkujen pisteet toisiinsa."
        structure: "## Alan pulssi\n\n{summary}\n\n## 📰 Pääuutiset\n\n{stories}\n\n## 📊 Lukuina\n\n{data}\n\n## 🔮 Analyysi ja trendit\n\n{analysis}\n\n## 👀 Seurattavaa\n\n{watch}\n\n## 💭 Meidän näkemyksemme\n\n{opinion}"
