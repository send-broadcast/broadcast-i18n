        dkim_wizard_link: "palveluntarjoajan ohjattu määritys"
        dkim_unchecked_manual: "Broadcast kokeili tavallisia DKIM-valitsinten nimiä, mutta tietueita ei löytynyt, eikä sähköpostipalvelimesi tyyppi tue verkkotunnuksen automaattista rekisteröintiä. DKIM-tietueesi voivat silti olla olemassa, sillä monet palveluntarjoajat käyttävät mukautettuja tai satunnaisia valitsinten nimiä, joita ei voi arvata. Jos tämä verkkotunnus allekirjoittaa mukautetulla valitsimella, lisää se alle sen tietueiden seuraamiseksi."
