# Broadcast admin interface: Finnish.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Address the user with plain imperatives and "sinä" forms where a pronoun is needed.
# Glossary:
#   broadcast -> kampanja           subscriber -> tilaaja
#   segment -> segmentti            sequence -> sarja
#   template -> malli               opt-in form -> tilauslomake
#   transactional email -> transaktiosähköposti   email -> sähköposti
#   email server -> sähköpostipalvelin   sender -> lähettäjä
#   sender identity -> lähettäjäidentiteetti
#   unsubscribe -> peruuttaa tilaus / tilauksen peruutus
#   bounce -> palautus              complaint -> valitus (roskapostivalitus)
#   suppression list -> estolista
#   open / click -> avaus / klikkaus   tag -> tunniste   webhook -> webhook
#   access token -> käyttöoikeustunnus   API token -> API-tunnus   channel -> kanava
#   draft -> luonnos   schedule -> ajastaa   send -> lähettää
#   test email -> testisähköposti   Test Server / Test Inbox -> Testipalvelin / Testisaapuneet
#   Autopilot -> Autopilotti        file asset -> tiedosto
#   dashboard -> koontinäkymä       settings -> asetukset
#   custom field -> mukautettu kenttä   preheader -> esikatseluteksti
#   brand kit -> brändipaketti      endpoint -> päätepiste
#   topic -> aihe
