# Broadcast admin interface: field names and validation messages, German.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.de.yml. bin/check validates the file; see CONTRIBUTING.md.
de:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Ratenlimit (Anfragen pro Minute)"
      admin_api_token:
        rate_limit_per_minute: "Ratenlimit (Anfragen pro Minute)"
      topic:
        name: "Name"
        storage: "Speicherort"
        custom_data_key: "Benutzerdefiniertes Feld"
        tag_name: "Tag"
        unset_receives: "Abonnenten ohne Wert"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "muss bei einem Tag-Thema aus sein: Ein Tag kann keine ausdrückliche Abmeldung speichern"
            base:
              locked_while_in_use: "Speicherort, benutzerdefiniertes Feld und Tag können nicht geändert werden, solange das Thema verwendet wird, weil sich sonst ändern würde, wer die E-Mails erhält. Verwendet von: %{uses}. Entfernen Sie das Thema zuerst dort."
              in_use_cannot_delete: "Das Thema kann nicht gelöscht werden, solange es verwendet wird, weil sich sonst ändern würde, wer die E-Mails erhält. Verwendet von: %{uses}. Entfernen Sie das Thema zuerst dort."
              kept_by_archived_broadcasts: "Das Thema kann nicht gelöscht werden, solange eine archivierte, nicht gesendete Kampagne es verwendet, weil die Kampagne nach dem Wiederherstellen an alle ihre Empfänger gesendet würde. Archiviert: %{uses}. Löschen Sie zuerst die Kampagne oder entfernen Sie das Thema aus ihr."
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "Der Abonnent hat %{topics} abgeschaltet. Nur der Abonnent kann es wieder anschalten, auf seiner Einstellungsseite."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "muss ein Thema dieses Kanals sein"
            operator:
              needs_custom_data_topic: "„ist nicht festgelegt“ braucht ein Thema mit benutzerdefiniertem Feld: Ein Tag-Thema ist nie ohne Wert"
  topic_uses:
    broadcast: "Kampagne „%{name}“"
    sequence: "Sequenz „%{name}“"
    opt_in_form: "Anmeldeformular „%{name}“"
    segment: "Segment „%{name}“"
    and_more: "und %{count} weitere"
