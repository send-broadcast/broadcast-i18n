# Broadcast plugins: plugin screens, permissions and emails, German.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.de.yml. bin/check validates the
# file; see CONTRIBUTING.md.
de:
  plugins:
    open_link:
      title: "Diesen Link öffnen?"
      body: "%{plugin} möchte eine Seite außerhalb von Broadcast öffnen. Prüfen Sie die Adresse, bevor Sie fortfahren."
      open: "Link öffnen"
    public_action:
      confirm_title: "Einen Moment"
      confirm_button: "Weiter"
      done_title: "Vielen Dank"
      failed_title: "Etwas ist schiefgelaufen"
      failed_body: "Wir konnten das nicht speichern. Bitte versuchen Sie den Link später erneut."
    developer_token:
      label: "Plugin-Entwickler"
      hint: "Für einen KI-Agenten, der Plugins schreibt: Er kann Entwürfe mit Testdaten anlegen, ändern und testen und sie Ihnen zur Prüfung vorlegen. Er kann keine echten Abonnentendaten lesen und nichts bereitstellen. Er kann keine anderen Berechtigungen haben und läuft innerhalb von 30 Tagen ab."
    webhook_endpoints:
      title: "Plugin-Ereignisse"
      hint: "Wird nur für die Ereignisse gesendet, die Sie hier ankreuzen. Alle auswählen schließt sie nicht ein."
      not_available: "hat ein Plugin-Ereignis, das in diesem Kanal nicht verfügbar ist"
    token_endpoints:
      label: "Plugin-Endpunkte"
      hint: "Die Plugin-API-Endpunkte, die dieser Token aufrufen darf, einer pro Zeile (plugin/endpunkt, oder plugin/* für alle). Der Token braucht außerdem die Berechtigung, die jeder Endpunkt verlangt."
      needs: "braucht %{permission}"
    permissions:
      settings:
        label: "Eigene Einstellungen"
        description: "Liest die Einstellungen, die Sie für dieses Plugin eingeben, auch geheime Werte."
      store:
        label: "Eigener Speicher"
        description: "Speichert eigene Daten in Broadcast."
      log:
        label: "Protokolle"
        description: "Schreibt Protokollzeilen, die Sie auf der Plugin-Seite lesen können."
      channel:
        label: "Kanalname"
        description: "Liest den Namen des Kanals, in dem es läuft."
      events:
        label: "Eigene Ereignisse"
        description: "Erfasst Ereignisse (zum Beispiel Bestellungen) für seine Segmentregeln."
      subscribers_read:
        label: "Abonnenten lesen"
        description: "Liest Abonnentendaten, Tags und benutzerdefinierte Felder."
      subscribers_write:
        label: "Abonnenten ändern"
        description: "Ändert Namen, benutzerdefinierte Felder und andere Angaben bestehender Abonnenten."
      tags_read:
        label: "Tags lesen"
        description: "Liest die Liste der Tags."
      tags_write:
        label: "Tags ändern"
        description: "Fügt Abonnenten Tags hinzu und entfernt sie."
      broadcasts_read:
        label: "Kampagnen lesen"
        description: "Liest Kampagnen und ihre Statistiken."
      sequences_read:
        label: "Sequenzen lesen"
        description: "Liest Sequenzen und ihre Schritte."
      segments_read:
        label: "Segmente lesen"
        description: "Liest Segmente und ihre Regeln."
      network:
        label: "Internetzugriff"
        description: "Verbindet sich mit diesen Websites: %{hosts}."
      subscribers_export:
        label: "Ihre ganze Liste kopieren"
        description: "Kann jeden Abonnenten Seite für Seite lesen und an %{hosts} senden."
      subscribers_create:
        label: "Neue Abonnenten hinzufügen"
        description: "Fügt Personen zu Ihrer Liste hinzu. Dabei gilt Ihre Double-Opt-in-Einstellung."
      network_wildcard:
        label: "Internetzugriff auf viele Websites"
        description: "Verbindet sich mit jeder Website, die zu %{hosts} passt."
      network_fromSetting:
        label: "Internetzugriff auf eine Adresse, die Sie eingeben"
        description: "Verbindet sich mit der Adresse, die Sie in der Einstellung %{setting} eingeben."
      output_html:
        label: "HTML in E-Mails"
        description: "Fügt E-Mails HTML hinzu. Broadcast bereinigt es vor dem Versand."
      hooks_beforeSend:
        label: "E-Mails vor dem Versand ändern"
        description: "Kann eine E-Mail überspringen oder ihren Betreff und Inhalt ändern. Es kann nicht ändern, wer sie erhält, den Absender oder den Abmeldelink."
      hooks_apiEndpoints:
        label: "Eigene API"
        description: "Fügt API-Adressen hinzu, die Aufrufer mit einem passenden API-Token nutzen können."
      events_webhook:
        label: "Eigene Ereignisse in Webhooks"
        description: "Erlaubt Ihnen, Ereignisse dieses Plugins an Ihre Webhook-Endpunkte zu senden. Nichts wird gesendet, bis Sie ein Ereignis für einen Endpunkt einschalten. Ein Webhook enthält das Ereignis, seine deklarierten Felder und die Abonnenten-ID, nie eine E-Mail-Adresse."
      hooks_publicActions:
        label: "Links in E-Mails, die jeder klicken kann"
        description: "Fügt E-Mails Links hinzu, die dieses Plugin ausführen, wenn ein Abonnent sie klickt, ohne Anmeldung. Broadcast weist nach, wer geklickt hat. Das Plugin erhält den Abonnenten und die Auswahl im Link."
      network_private:
        label: "Zugriff auf eine private Adresse"
        description: "Verbindet sich mit einer Adresse in Ihrem privaten Netzwerk, die Sie freigeben."
      email_sender:
        label: "Absender ändern"
        description: "Ändert Von oder Antwort-an auf einen Absender, der in diesem Kanal verifiziert ist."
      sql:
        label: "Datenbankzugriff"
      files:
        label: "Dateizugriff"
      env:
        label: "Zugriff auf Servereinstellungen"
      process:
        label: "Programme starten"
      subscribers_resubscribe:
        label: "Personen erneut anmelden"
      suppressions_write:
        label: "Sperren entfernen"
      email_recipients:
        label: "E-Mail-Empfänger ändern"
      email_unsubscribe:
        label: "Abmeldelink ändern"
