# Broadcast admin interface: Danish.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal "du". Glossary:
#   broadcast -> kampagne           subscriber -> abonnent
#   segment -> segment              sequence -> sekvens
#   template -> skabelon            opt-in form -> tilmeldingsformular
#   transactional email -> transaktionsmail   email -> e-mail
#   email server -> mailserver      sender -> afsender
#   sender identity -> afsenderidentitet
#   unsubscribe -> afmelde / afmelding
#   bounce -> bounce                complaint -> klage (spamklage)
#   suppression list -> spærreliste
#   open / click -> åbning / klik   tag -> tag   webhook -> webhook
#   access token -> adgangstoken    API token -> API-token   channel -> kanal
#   draft -> kladde   schedule -> planlægge   send -> sende
#   test email -> testmail          Test Server / Test Inbox -> Testserver / Testindbakke
#   Autopilot -> Autopilot          file asset -> fil
#   dashboard -> oversigt           settings -> indstillinger
#   custom field -> brugerdefineret felt   preheader -> forhåndsvisningstekst
#   brand kit -> brandkit           endpoint -> endpoint
#   topic -> emne
