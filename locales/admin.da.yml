        needs_hint_title: "Ikke ændret: rækkefølgen kan ikke afgøres"
        needs_hint_body_html: "Disse felter indeholder datoer som <code>01/02/2026</code>, hvor intet i dataene siger, om det er 1. februar eller 2. januar, og ingen anden værdi i feltet afgør det. Et gæt ville flytte hver eneste af dem en måned."
        conflicting_title: "Ikke ændret: to formater i ét felt"
        conflicting_body: "Disse felter indeholder både datoer med dagen først og datoer med måneden først, så ingen enkelt læsning passer til dem alle. Løsningen er at importere kolonnen igen med formatet angivet."
        uncertain_title: "Ikke ændret: mere end ét muligt svar"
        uncertain_body: "Disse blev ikke ændret, fordi den rigtige værdi ikke var sikker. Afgør hver enkelt selv i stedet for at lade reparationen gætte."
        collision_title: "Ikke ændret: ville kollidere med en anden abonnent"
        collision_body: "En oprydning af disse adresser ville give en adresse, som en anden abonnent allerede har. At flette to rigtige poster er en separat beslutning, så de blev sprunget over."
        back: "← Tilbage til Vedligeholdelse"
      tasks:
        custom_data_dates:
          title: "Reparer datoer i brugerdefinerede felter"
          description: "Omskriver datoer i brugerdefinerede felter til ISO (2026-01-24), hvor der kun er én mulig læsning: ekstra mellemrum, manglende nuller, formater med året først, navngivne måneder og dag/måned-værdier, der selv viser deres rækkefølge. Segmentregler kan kun sammenligne datoer, der er skrevet på denne måde."
        segment_rule_values:
          title: "Reparer datoer indtastet i segmentregler"
          description: "En regel, der sammenligner med en dato som 24/01/2026, matcher ingen og siger intet om hvorfor. Dette omskriver de værdier til ISO."
        subscriber_emails:
          title: "Ryd op i abonnenters e-mailadresser"
          description: "Fjerner overflødige mellemrum og skriver adresser med små bogstaver, så opslag og importer ikke længere overser dem. Hvis oprydningen afslører den samme adresse to gange, deaktiveres den uryddelige kopi, så personen ikke tælles (eller mailes) to gange. Intet slettes, og dens historik viser, hvilken abonnent den er en dublet af. Påvirker kun poster, der blev skrevet, før adresser blev ryddet op automatisk, så de fleste kanaler finder intet."
        whitespace:
          title: "Fjern overflødige mellemrum fra abonnentdata"
          description: "Fjerner mellemrum i starten og slutningen af navne og værdier i brugerdefinerede felter. En værdi med et mellemrum foran matcher ikke en segmentregel, der leder efter den."
        suppression_promotion:
          title: "Kopier kanalens spærringer til den globale liste"
          description: "En adresse, der har bouncet eller klaget i denne kanal, modtager stadig mails, når samme person optræder i en anden kanal, og det koster afsenderomdømme. Dette kopierer alle adresser på kanalens spærreliste til den globale liste, så de blokeres overalt. Kanalens egen liste bevares, og hvis du kører det igen, tilføjes der ikke noget."
        postmark_server_names:
          title: "Reparer Postmark-servernavne"
          description: "Tidligere versioner sendte Postmark et servernavn med \"Postmark - \" foran og tilføjede endnu et præfiks, hver gang opsætningen blev kørt igen, så servere endte med navne som \"Postmark - Postmark - Acme\". Dette omdøber dem i Postmark, så de svarer til navnet, der vises her. En server, hvis navn i Postmark afviger af en anden grund, kan være omdøbt der med vilje, så den bliver rapporteret i stedet for ændret. De fleste installationer finder intet."
