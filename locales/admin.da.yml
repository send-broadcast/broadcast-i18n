    autopilot_presets:
      tech:
        tone: "Teknisk og informativ, men tilgængelig. Brug et klart sprog til at forklare komplekse emner. Medtag kodeeksempler eller tekniske detaljer, hvor det er relevant. Hold en professionel, men imødekommende tone, som udviklere sætter pris på."
        content: "Fokuser på: nye versioner, breaking changes, sikkerhedsopdateringer, ydelsesforbedringer og udviklerværktøjer. Prioriter information, der kan handles på. Medtag links til dokumentation og relevante ressourcer."
        structure: "## 🚀 Nyheder\n\n{new_releases}\n\n## ⚠️ Breaking changes\n\n{breaking_changes}\n\n## 🔧 Fejlrettelser og forbedringer\n\n{fixes}\n\n## 📚 Værd at læse\n\n{articles}\n\n## 📅 På vej\n\n{upcoming}"
      company:
        tone: "Professionel, varm og selvsikker. Tal som en betroet partner, der deler nyheder. Find balancen mellem at være informativ og personlig. Undgå virksomhedsjargon, og vær menneskelig og autentisk."
        content: "Fremhæv virksomhedens milepæle, produktopdateringer, nyt fra teamet og kundesucceshistorier. Begynd med de vigtigste nyheder. Medtag tydelige opfordringer til handling, hvor det giver mening."
        structure: "## Hilsen fra teamet\n\n{intro}\n\n## Produktopdateringer\n\n{updates}\n\n## Nyt fra virksomheden\n\n{news}\n\n## Kunde i fokus\n\n{spotlight}\n\n## Hvad der kommer\n\n{roadmap}"
      community:
        tone: "Venlig, entusiastisk og inkluderende. Fejr fællesskabets bidrag, og skab forbindelser. Brug et uformelt sprog og lidt humor en gang imellem. Få læserne til at føle sig som værdsatte medlemmer af fællesskabet."
        content: "Vis fællesskabets bidrag frem, fremhæv medlemmernes præstationer, del kommende begivenheder, og opfordr til deltagelse. Giv plads til forskellige stemmer og perspektiver fra fællesskabet."
        structure: "## 👋 Hej, fællesskab!\n\n{greeting}\n\n## 🌟 Højdepunkter fra fællesskabet\n\n{highlights}\n\n## 🎉 Medlem i fokus\n\n{spotlight}\n\n## 📆 Kommende begivenheder\n\n{events}\n\n## 💬 Ugens diskussion\n\n{discussion}\n\n## 🙌 Vær med\n\n{cta}"
      changelog:
        tone: "Klar, præcis og saglig. Fokuser på, hvad der er ændret, og hvorfor det betyder noget for brugerne. Brug punktopstillinger, så teksten er let at skimme. Vær direkte om både forbedringer og kendte problemer."
        content: "Organiser efter: nye funktioner, forbedringer, fejlrettelser og udfasninger. Medtag versionsnumre, hvor det er relevant. Link til detaljeret dokumentation ved komplekse ændringer."
        structure: "## Version {version}, {date}\n\n### ✨ Nye funktioner\n\n{features}\n\n### 🔄 Forbedringer\n\n{improvements}\n\n### 🐛 Fejlrettelser\n\n{fixes}\n\n### ⚠️ Udfasninger\n\n{deprecations}\n\n### 📝 Bemærkninger\n\n{notes}"
      curated:
        tone: "Gennemtænkt og meningsfuld, som en kyndig ven, der deler sine fund. Giv en kort, men indsigtsfuld kommentar til hvert link. Vær selektiv: kvalitet frem for kvantitet."
        content: "Udvælg de mest interessante og værdifulde links. Gruppér dem efter tema eller kategori. Tilføj personlige kommentarer, der forklarer, hvorfor hvert link er værd at læse. Medtag en blanding af artikler, værktøjer og ressourcer."
        structure: "## Ugens udvalgte\n\n{intro}\n\n### 📖 Skal læses\n\n{must_read}\n\n### 🛠 Værktøjer og ressourcer\n\n{tools}\n\n### 💡 Idéer og inspiration\n\n{ideas}\n\n### 🎯 Hurtige links\n\n{quick_links}\n\n---\n\n*Har du fundet noget godt? Svar for at dele det!*"
      industry:
        tone: "Autoritativ, men tilgængelig. Giv analyse og kontekst, ikke kun nyheder. Hjælp læserne med at forstå, hvorfor udviklingen er vigtig. Find balancen mellem dybde og læsbarhed."
        content: "Dæk de største nyheder, tendenser og analyser i branchen. Giv kontekst, og forklar konsekvenserne. Medtag ekspertudtalelser og data, hvor de findes. Forbind de forskellige udviklinger med hinanden."
        structure: "## Branchens puls\n\n{summary}\n\n## 📰 Tophistorier\n\n{stories}\n\n## 📊 I tal\n\n{data}\n\n## 🔮 Analyse og tendenser\n\n{analysis}\n\n## 👀 Hold øje med\n\n{watch}\n\n## 💭 Vores holdning\n\n{opinion}"
