# Broadcast plugins: plugin screens, permissions and emails, Swedish.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.sv.yml. bin/check validates the
# file; see CONTRIBUTING.md.
