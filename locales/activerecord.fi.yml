# Broadcast admin interface: field names and validation messages, Finnish.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.fi.yml. bin/check validates the file; see CONTRIBUTING.md.
fi:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Nopeusrajoitus (pyyntöä minuutissa)"
      admin_api_token:
        rate_limit_per_minute: "Nopeusrajoitus (pyyntöä minuutissa)"
      topic:
        name: "Nimi"
        storage: "Tallennuspaikka"
        custom_data_key: "Mukautettu kenttä"
        tag_name: "Tunniste"
        unset_receives: "Tilaajat ilman arvoa"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "on oltava pois päältä tunnisteaiheessa: tunniste ei voi tallentaa erillistä kieltäytymistä"
            base:
              locked_while_in_use: "Tallennuspaikkaa, mukautettua kenttää ja tunnistetta ei voi muuttaa, kun aihe on käytössä, koska se muuttaisi sitä, kuka viestit saa. Käytössä kohteissa: %{uses}. Poista aihe niistä ensin."
              in_use_cannot_delete: "Aihetta ei voi poistaa, kun se on käytössä, koska se muuttaisi sitä, kuka viestit saa. Käytössä kohteissa: %{uses}. Poista aihe niistä ensin."
              kept_by_archived_broadcasts: "Aihetta ei voi poistaa, kun sitä käyttää arkistoitu kampanja, jota ei ole lähetetty, koska arkistosta palautettu kampanja lähtisi kaikille sen vastaanottajille. Arkistoidut: %{uses}. Poista ensin kampanja tai poista aihe siitä."
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "Tilaaja poisti käytöstä: %{topics}. Vain tilaaja voi ottaa sen uudelleen käyttöön omalla asetussivullaan."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "on oltava tämän kanavan aihe"
            operator:
              needs_custom_data_topic: "\"ei ole asetettu\" vaatii mukautetun kentän aiheen: tunnisteaihe ei ole koskaan ilman arvoa"
  topic_uses:
    broadcast: "kampanja \"%{name}\""
    sequence: "sarja \"%{name}\""
    opt_in_form: "tilauslomake \"%{name}\""
    segment: "segmentti \"%{name}\""
    and_more: "ja %{count} muuta"
