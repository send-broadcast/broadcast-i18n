        collision_body: "Hvis disse adressene ble ryddet, ville resultatet bli en adresse som en annen abonnent allerede har. Å slå sammen to ekte poster er en egen avgjørelse, så de ble hoppet over."
        back: "← Tilbake til vedlikehold"
      tasks:
        custom_data_dates:
          title: "Reparer datoer i egendefinerte felt"
          description: "Skriver om datoer lagret i egendefinerte felt til ISO (2026-01-24) der det bare finnes én mulig tolkning: ekstra mellomrom, manglende nuller, formater med året først, månedsnavn og dag/måned-verdier som selv viser rekkefølgen. Segmentregler kan bare sammenligne datoer som er skrevet slik."
        segment_rule_values:
          title: "Reparer datoer skrevet inn i segmentregler"
          description: "En regel som sammenligner med en dato som 24/01/2026, treffer ingen og sier ingenting om hvorfor. Dette skriver om slike verdier til ISO."
        subscriber_emails:
          title: "Rydd i abonnentenes e-postadresser"
          description: "Fjerner overflødige mellomrom og gjør adressene om til små bokstaver, slik at oppslag og importer ikke lenger går glipp av dem. Der ryddingen avdekker samme adresse to ganger, deaktiveres den uryddige kopien slik at personen ikke telles (eller får e-post) to ganger; ingenting slettes, og historikken viser hvilken abonnent den er et duplikat av. Gjelder bare poster som ble skrevet før adresser ble ryddet automatisk, så de fleste kanaler vil ikke finne noe."
        whitespace:
          title: "Fjern overflødige mellomrom fra abonnentdata"
          description: "Fjerner mellomrom foran og bak i navn og verdier i egendefinerte felt. En verdi med mellomrom foran vil ikke samsvare med en segmentregel som leter etter den."
        suppression_promotion:
          title: "Kopier sperringene i denne kanalen til den globale listen"
          description: "En adresse som har gitt retur eller klaget i denne kanalen, får fortsatt e-post når samme person dukker opp i en annen kanal, og det koster avsenderomdømme. Dette kopierer alle adressene i sperrelisten for denne kanalen til den globale listen, slik at de blokkeres overalt. Kanalens egen liste beholdes, og hvis du kjører det på nytt, legges ingenting til."
        postmark_server_names:
          title: "Reparer Postmark-servernavn"
          description: "Tidligere versjoner sendte Postmark et servernavn med «Postmark - » foran, og la til et nytt prefiks hver gang oppsettet ble kjørt på nytt, slik at servere endte opp med navn som «Postmark - Postmark - Acme». Dette gir dem nytt navn i Postmark slik at det samsvarer med navnet som vises her. En server med et Postmark-navn som er forskjellig av andre grunner, kan ha fått nytt navn der med vilje, så den blir rapportert i stedet for endret. De fleste installasjoner vil ikke finne noe."
