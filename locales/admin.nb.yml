    autopilot_presets:
      tech:
        tone: "Teknisk og informativ, men tilgjengelig. Bruk et tydelig språk for å forklare komplekse temaer. Ta med kodeeksempler eller tekniske detaljer der det er relevant. Hold en profesjonell, men imøtekommende stemme som utviklere setter pris på."
        content: "Fokuser på: nye utgivelser, endringer som bryter kompatibilitet, sikkerhetsoppdateringer, ytelsesforbedringer og utviklerverktøy. Prioriter informasjon man kan handle på. Ta med lenker til dokumentasjon og relevante ressurser."
        structure: "## 🚀 Hva er nytt\n\n{new_releases}\n\n## ⚠️ Endringer som bryter kompatibilitet\n\n{breaking_changes}\n\n## 🔧 Feilrettinger og forbedringer\n\n{fixes}\n\n## 📚 Verdt å lese\n\n{articles}\n\n## 📅 Kommer snart\n\n{upcoming}"
      company:
        tone: "Profesjonell, varm og selvsikker. Snakk som en betrodd partner som deler oppdateringer. Balanser det informative med det personlige. Unngå bedriftssjargong: vær menneskelig og ekte."
        content: "Fremhev milepæler for selskapet, produktoppdateringer, nyheter fra teamet og suksesshistorier fra kunder. Start med de viktigste nyhetene. Ta med tydelige oppfordringer til handling der det passer."
        structure: "## Hilsen fra teamet\n\n{intro}\n\n## Produktoppdateringer\n\n{updates}\n\n## Nytt fra selskapet\n\n{news}\n\n## Kunden i fokus\n\n{spotlight}\n\n## Dette kommer\n\n{roadmap}"
      community:
        tone: "Vennlig, entusiastisk og inkluderende. Feir bidrag fra fellesskapet og skap tilhørighet. Bruk et uformelt språk og litt humor innimellom. Få leserne til å føle seg som verdsatte medlemmer av fellesskapet."
        content: "Vis frem bidrag fra fellesskapet, fremhev det medlemmene har oppnådd, del kommende arrangementer og oppmuntre til deltakelse. Løft frem ulike stemmer og perspektiver fra fellesskapet."
        structure: "## 👋 Hei, alle sammen!\n\n{greeting}\n\n## 🌟 Høydepunkter fra fellesskapet\n\n{highlights}\n\n## 🎉 Medlem i fokus\n\n{spotlight}\n\n## 📆 Kommende arrangementer\n\n{events}\n\n## 💬 Ukens diskusjon\n\n{discussion}\n\n## 🙌 Bli med\n\n{cta}"
      changelog:
        tone: "Klar, konsis og saklig. Fokuser på hva som er endret og hvorfor det betyr noe for brukerne. Bruk punktlister så teksten er lett å skumme. Vær direkte om både forbedringer og kjente problemer."
        content: "Organiser etter: nye funksjoner, forbedringer, feilrettinger og utfasinger. Ta med versjonsnumre der det er aktuelt. Lenk til detaljert dokumentasjon for komplekse endringer."
        structure: "## Versjon {version}, {date}\n\n### ✨ Nye funksjoner\n\n{features}\n\n### 🔄 Forbedringer\n\n{improvements}\n\n### 🐛 Feilrettinger\n\n{fixes}\n\n### ⚠️ Utfasinger\n\n{deprecations}\n\n### 📝 Merknader\n\n{notes}"
      curated:
        tone: "Gjennomtenkt og med meninger, som en kunnskapsrik venn som deler funn. Gi korte, men innsiktsfulle kommentarer til hver lenke. Vær kresen: kvalitet fremfor kvantitet."
        content: "Velg ut de mest interessante og verdifulle lenkene. Grupper etter tema eller kategori. Legg til personlige kommentarer som forklarer hvorfor hver lenke er verdt å lese. Ta med en blanding av artikler, verktøy og ressurser."
        structure: "## Ukens utvalg\n\n{intro}\n\n### 📖 Må leses\n\n{must_read}\n\n### 🛠 Verktøy og ressurser\n\n{tools}\n\n### 💡 Ideer og inspirasjon\n\n{ideas}\n\n### 🎯 Kjappe lenker\n\n{quick_links}\n\n---\n\n*Har du funnet noe bra? Svar og del det!*"
      industry:
        tone: "Autoritativ, men tilgjengelig. Gi analyse og kontekst, ikke bare nyheter. Hjelp leserne å forstå hvorfor utviklingen betyr noe. Balanser dybde med lesbarhet."
        content: "Dekk viktige bransjenyheter, trender og analyser. Gi kontekst og konsekvenser. Ta med ekspertuttalelser og data der det finnes. Se sammenhenger mellom ulike hendelser."
        structure: "## Bransjepulsen\n\n{summary}\n\n## 📰 Hovedsaker\n\n{stories}\n\n## 📊 I tall\n\n{data}\n\n## 🔮 Analyse og trender\n\n{analysis}\n\n## 👀 Verdt å følge med på\n\n{watch}\n\n## 💭 Vårt syn\n\n{opinion}"
