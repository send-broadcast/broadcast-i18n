        needs_hint_title: "Urørt: rekkefølgen kan ikke fastslås"
        needs_hint_body_html: "Disse feltene inneholder datoer som <code>01/02/2026</code>, der ingenting i dataene sier om det er 1. februar eller 2. januar, og ingen andre verdier i feltet avgjør det. Gjetting ville flyttet hver eneste av dem med en måned."
        conflicting_title: "Urørt: to formater i ett felt"
        conflicting_body: "Disse feltene inneholder både datoer med dagen først og med måneden først, så ingen enkelt tolkning er riktig for alle. Løsningen er å importere kolonnen på nytt med formatet angitt."
