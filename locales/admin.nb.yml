# Broadcast admin interface: Norwegian Bokmål.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal "du". Glossary:
#   broadcast -> kampanje           subscriber -> abonnent
#   segment -> segment              sequence -> sekvens
#   template -> mal                 opt-in form -> påmeldingsskjema
#   transactional email -> transaksjonell e-post   email -> e-post
#   email server -> e-postserver    sender -> avsender
#   sender identity -> avsenderidentitet
#   unsubscribe -> melde seg av / avmelding
#   bounce -> returnert e-post (short labels: retur)   complaint -> klage (spamklage)
#   suppression list -> sperreliste
#   open / click -> åpning / klikk  tag -> tagg   webhook -> webhook
#   access token -> tilgangstoken   API token -> API-token   channel -> kanal
#   draft -> utkast   schedule -> planlegge   send -> sende
#   test email -> test-e-post       Test Server / Test Inbox -> Testserver / Testinnboks
#   Autopilot -> Autopilot          file asset -> fil
#   dashboard -> oversikt           settings -> innstillinger
#   custom field -> egendefinert felt   preheader -> forhåndsvisningstekst
#   brand kit -> merkevaresett      endpoint -> endepunkt
#   topic -> emne
