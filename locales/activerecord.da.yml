# Broadcast admin interface: field names and validation messages, Danish.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.da.yml. bin/check validates the file; see CONTRIBUTING.md.
da:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Hastighedsgrænse (forespørgsler pr. minut)"
      admin_api_token:
        rate_limit_per_minute: "Hastighedsgrænse (forespørgsler pr. minut)"
      topic:
        name: "Navn"
        storage: "Lagring"
        custom_data_key: "Brugerdefineret felt"
        tag_name: "Tag"
        unset_receives: "Abonnenter uden værdi"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "skal være slået fra for et tag-emne: et tag kan ikke registrere et udtrykkeligt fravalg"
            base:
              locked_while_in_use: "Lagring, brugerdefineret felt og tag kan ikke ændres, mens emnet er i brug, fordi det ville ændre, hvem der modtager mails. I brug af: %{uses}. Fjern emnet derfra først."
              in_use_cannot_delete: "Emnet kan ikke slettes, mens det er i brug, fordi det ville ændre, hvem der modtager mails. I brug af: %{uses}. Fjern emnet derfra først."
              kept_by_archived_broadcasts: "Emnet kan ikke slettes, mens en arkiveret kampagne, der ikke er sendt, bruger det, fordi kampagnen ville blive sendt til alle sine modtagere, hvis den gendannes fra arkivet. Arkiveret: %{uses}. Slet kampagnen, eller fjern emnet fra den først."
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "Abonnenten har slået %{topics} fra. Kun abonnenten kan slå det til igen, på sin indstillingsside."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "skal være et emne i denne kanal"
            operator:
              needs_custom_data_topic: "\"er ikke angivet\" kræver et emne med brugerdefineret felt: et tag-emne er aldrig uden værdi"
  topic_uses:
    broadcast: "kampagne \"%{name}\""
    sequence: "sekvens \"%{name}\""
    opt_in_form: "tilmeldingsformular \"%{name}\""
    segment: "segment \"%{name}\""
    and_more: "og %{count} til"
