# Broadcast admin interface: field names and validation messages, Polish.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.pl.yml. bin/check validates the file; see CONTRIBUTING.md.
pl:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Limit szybkości (żądania na minutę)"
      admin_api_token:
        rate_limit_per_minute: "Limit szybkości (żądania na minutę)"
      topic:
        name: "Nazwa"
        storage: "Miejsce zapisu"
        custom_data_key: "Pole niestandardowe"
        tag_name: "Tag"
        unset_receives: "Subskrybenci bez wartości"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "musi być wyłączone dla tematu opartego na tagu: tag nie może zapisać jawnej rezygnacji"
            base:
              locked_while_in_use: "Miejsca zapisu, pola niestandardowego i tagu nie można zmienić, dopóki temat jest używany, bo zmieniłoby to, kto otrzymuje wiadomości. Używany w: %{uses}. Najpierw usuń stamtąd temat."
              in_use_cannot_delete: "Nie można usunąć tematu, dopóki jest używany, bo zmieniłoby to, kto otrzymuje wiadomości. Używany w: %{uses}. Najpierw usuń stamtąd temat."
              kept_by_archived_broadcasts: "Nie można usunąć tematu, dopóki używa go zarchiwizowana, niewysłana kampania, bo po przywróceniu z archiwum zostałaby wysłana do wszystkich swoich odbiorców. Zarchiwizowane: %{uses}. Najpierw usuń kampanię albo usuń z niej temat."
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "Subskrybent wyłączył: %{topics}. Tylko subskrybent może to ponownie włączyć na swojej stronie preferencji."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "musi być tematem tego kanału"
            operator:
              needs_custom_data_topic: "„nie jest ustawiony” wymaga tematu opartego na polu niestandardowym: temat oparty na tagu zawsze ma wartość"
  topic_uses:
    broadcast: "kampania „%{name}”"
    sequence: "sekwencja „%{name}”"
    opt_in_form: "formularz zapisu „%{name}”"
    segment: "segment „%{name}”"
    and_more: "i %{count} więcej"
