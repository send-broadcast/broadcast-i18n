# Broadcast plugins: plugin screens, permissions and emails, French.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.fr.yml. bin/check validates the
# file; see CONTRIBUTING.md.
fr:
  plugins:
    open_link:
      title: "Ouvrir ce lien ?"
      body: "%{plugin} veut ouvrir une page en dehors de Broadcast. Vérifiez l'adresse avant de continuer."
      open: "Ouvrir le lien"
    editor_insert:
      close: "Fermer"
      from: "De %{plugin}"
      cleaned: "Broadcast vérifie et nettoie le HTML avant qu'il n'entre dans l'e-mail."
      group: "Depuis les plugins"
      menu: "Insérer depuis un plugin"
    public_action:
      confirm_title: "Un instant"
      confirm_button: "Continuer"
      done_title: "Merci"
      failed_title: "Une erreur s'est produite"
      failed_body: "Nous n'avons pas pu enregistrer cela. Réessayez le lien plus tard."
      test_title: "Ceci est un e-mail de test"
      test_body: "Le lien fonctionne. Dans le vrai e-mail, ce clic est enregistré pour la personne qui clique. Rien n'a été enregistré cette fois."
    developer_token:
      label: "Développeur de plugins"
      hint: "Pour un agent IA qui écrit des plugins : il peut créer, modifier et tester des brouillons avec des données de test, puis vous les soumettre pour examen. Il ne peut pas lire les vraies données des abonnés ni déployer. Il ne peut pas avoir d'autres autorisations et expire sous 30 jours."
    webhook_endpoints:
      title: "Événements de plugins"
      hint: "Envoyés uniquement pour les événements que vous cochez ici. Tout sélectionner ne les inclut pas."
      not_available: "contient un événement de plugin qui n'est pas disponible dans ce canal"
    token_endpoints:
      label: "Points de terminaison de plugins"
      hint: "Les points de terminaison de l'API des plugins que ce jeton peut appeler, un par ligne (plugin/point-de-terminaison, ou plugin/* pour tous). Le jeton a aussi besoin de l'autorisation demandée par chaque point de terminaison."
      needs: "nécessite %{permission}"
    permissions:
      settings:
        label: "Ses propres paramètres"
        description: "Lit les paramètres que vous saisissez pour ce plugin, y compris les valeurs secrètes."
      store:
        label: "Son propre stockage"
        description: "Conserve ses propres données dans Broadcast."
      log:
        label: "Journaux"
        description: "Écrit des lignes de journal que vous pouvez lire sur la page du plugin."
      channel:
        label: "Nom du canal"
        description: "Lit le nom du canal dans lequel il s'exécute."
      events:
        label: "Ses propres événements"
        description: "Enregistre des événements (par exemple des commandes) pour ses règles de segment."
      subscribers_read:
        label: "Lire les abonnés"
        description: "Lit les informations des abonnés, leurs tags et leurs champs personnalisés."
      subscribers_write:
        label: "Modifier les abonnés"
        description: "Modifie les noms, les champs personnalisés et d'autres informations des abonnés existants."
      tags_read:
        label: "Lire les tags"
        description: "Lit la liste des tags."
      tags_write:
        label: "Modifier les tags"
        description: "Ajoute des tags aux abonnés et les retire."
      broadcasts_read:
        label: "Lire les campagnes"
        description: "Lit les campagnes et leurs statistiques."
      sequences_read:
        label: "Lire les séquences"
        description: "Lit les séquences et leurs étapes."
      segments_read:
        label: "Lire les segments"
        description: "Lit les segments et leurs règles."
      network:
        label: "Accès à Internet"
        description: "Se connecte à ces sites : %{hosts}."
      subscribers_export:
        label: "Copier toute votre liste"
        description: "Peut lire chaque abonné, page par page, et les envoyer à %{hosts}."
      subscribers_create:
        label: "Ajouter de nouveaux abonnés"
        description: "Ajoute des personnes à votre liste. Votre paramètre de double opt-in s'applique."
      network_wildcard:
        label: "Accès à Internet vers de nombreux sites"
        description: "Se connecte à tout site qui correspond à %{hosts}."
      network_fromSetting:
        label: "Accès à Internet vers une adresse que vous saisissez"
        description: "Se connecte à l'adresse que vous saisissez dans le paramètre %{setting}."
      output_html:
        label: "HTML dans les e-mails"
        description: "Ajoute du HTML aux e-mails. Broadcast le nettoie avant l'envoi."
      hooks_beforeSend:
        label: "Modifier les e-mails avant leur envoi"
        description: "Peut ignorer un e-mail ou modifier son objet et son contenu. Il ne peut pas modifier qui le reçoit, l'expéditeur ni le lien de désabonnement."
      hooks_apiEndpoints:
        label: "Sa propre API"
        description: "Ajoute des adresses d'API que les appelants disposant d'un jeton API correspondant peuvent utiliser."
      events_webhook:
        label: "Ses événements dans les webhooks"
        description: "Vous permet d'envoyer les événements de ce plugin à vos points de terminaison de webhook. Rien n'est envoyé tant que vous n'activez pas un événement pour un point de terminaison. Un webhook contient l'événement, ses champs déclarés et l'identifiant de l'abonné, jamais une adresse e-mail."
      hooks_publicActions:
        label: "Liens dans les e-mails que tout le monde peut cliquer"
        description: "Ajoute aux e-mails des liens qui exécutent ce plugin quand un abonné clique dessus, sans connexion. Broadcast vérifie qui a cliqué. Le plugin reçoit l'abonné et le choix contenu dans le lien."
      network_private:
        label: "Accès à une adresse privée"
        description: "Se connecte à une adresse de votre réseau privé que vous approuvez."
      email_sender:
        label: "Modifier l'expéditeur"
        description: "Remplace De ou Répondre à par un expéditeur vérifié dans ce canal."
      sql:
        label: "Accès à la base de données"
      files:
        label: "Accès aux fichiers"
      env:
        label: "Accès aux paramètres du serveur"
      process:
        label: "Lancer des programmes"
      subscribers_resubscribe:
        label: "Réabonner des personnes"
      suppressions_write:
        label: "Retirer des exclusions"
      email_recipients:
        label: "Modifier les destinataires des e-mails"
      email_unsubscribe:
        label: "Modifier le lien de désabonnement"
