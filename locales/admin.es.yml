    autopilot_presets:
      tech:
        tone: "Técnico e informativo, pero accesible. Usa un lenguaje claro para explicar temas complejos. Incluye fragmentos de código o detalles técnicos cuando sea pertinente. Mantén una voz profesional pero cercana que los desarrolladores aprecien."
        content: "Céntrate en: nuevas versiones, cambios incompatibles, actualizaciones de seguridad, mejoras de rendimiento y herramientas para desarrolladores. Prioriza la información práctica. Incluye enlaces a la documentación y a recursos relevantes."
        structure: "## 🚀 Novedades\n\n{new_releases}\n\n## ⚠️ Cambios incompatibles\n\n{breaking_changes}\n\n## 🔧 Correcciones y mejoras\n\n{fixes}\n\n## 📚 Lecturas recomendadas\n\n{articles}\n\n## 📅 Próximamente\n\n{upcoming}"
      company:
        tone: "Profesional, cálido y seguro. Habla como un socio de confianza que comparte novedades. Equilibra lo informativo con lo cercano. Evita la jerga corporativa: sé humano y auténtico."
        content: "Destaca los hitos de la empresa, las novedades del producto, las noticias del equipo y los casos de éxito de clientes. Empieza por la noticia más importante. Incluye llamadas a la acción claras cuando proceda."
        structure: "## Saludos del equipo\n\n{intro}\n\n## Novedades del producto\n\n{updates}\n\n## Noticias de la empresa\n\n{news}\n\n## Cliente destacado\n\n{spotlight}\n\n## Lo que viene\n\n{roadmap}"
      community:
        tone: "Cercano, entusiasta e inclusivo. Celebra las aportaciones de la comunidad y fomenta la conexión. Usa un lenguaje conversacional y algo de humor de vez en cuando. Haz que los lectores se sientan miembros valiosos de la comunidad."
        content: "Muestra las aportaciones de la comunidad, destaca los logros de sus miembros, comparte los próximos eventos y anima a participar. Da espacio a voces y perspectivas diversas de la comunidad."
        structure: "## 👋 ¡Hola, comunidad!\n\n{greeting}\n\n## 🌟 Lo más destacado de la comunidad\n\n{highlights}\n\n## 🎉 Miembro destacado\n\n{spotlight}\n\n## 📆 Próximos eventos\n\n{events}\n\n## 💬 El debate de la semana\n\n{discussion}\n\n## 🙌 Participa\n\n{cta}"
      changelog:
        tone: "Claro, conciso y objetivo. Céntrate en qué ha cambiado y por qué importa a los usuarios. Usa viñetas para facilitar la lectura rápida. Sé directo tanto con las mejoras como con los problemas conocidos."
        content: "Organiza por: nuevas funciones, mejoras, correcciones de errores y funciones obsoletas. Incluye números de versión cuando proceda. Enlaza a documentación detallada para los cambios complejos."
        structure: "## Versión {version} - {date}\n\n### ✨ Nuevas funciones\n\n{features}\n\n### 🔄 Mejoras\n\n{improvements}\n\n### 🐛 Correcciones de errores\n\n{fixes}\n\n### ⚠️ Funciones obsoletas\n\n{deprecations}\n\n### 📝 Notas\n\n{notes}"
      curated:
        tone: "Reflexivo y con opinión, como un amigo entendido que comparte sus hallazgos. Aporta un comentario breve pero valioso sobre cada enlace. Sé selectivo: calidad antes que cantidad."
        content: "Selecciona los enlaces más interesantes y valiosos. Agrúpalos por tema o categoría. Añade un comentario personal que explique por qué merece la pena leer cada enlace. Incluye una mezcla de artículos, herramientas y recursos."
        structure: "## Selección de la semana\n\n{intro}\n\n### 📖 Imprescindibles\n\n{must_read}\n\n### 🛠 Herramientas y recursos\n\n{tools}\n\n### 💡 Ideas e inspiración\n\n{ideas}\n\n### 🎯 Enlaces rápidos\n\n{quick_links}\n\n---\n\n*¿Has encontrado algo genial? ¡Responde para compartirlo!*"
      industry:
        tone: "Riguroso pero accesible. Aporta análisis y contexto, no solo noticias. Ayuda a los lectores a entender por qué importan los acontecimientos. Equilibra la profundidad con la legibilidad."
        content: "Cubre las principales noticias, tendencias y análisis del sector. Aporta contexto e implicaciones. Incluye opiniones de expertos y datos cuando estén disponibles. Relaciona entre sí los distintos acontecimientos."
        structure: "## El pulso del sector\n\n{summary}\n\n## 📰 Noticias principales\n\n{stories}\n\n## 📊 En cifras\n\n{data}\n\n## 🔮 Análisis y tendencias\n\n{analysis}\n\n## 👀 Qué vigilar\n\n{watch}\n\n## 💭 Nuestra opinión\n\n{opinion}"
