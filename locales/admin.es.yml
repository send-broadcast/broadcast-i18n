# Broadcast admin interface: Spanish.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal "tú", neutral international Spanish (no regional slang; "correo" not "mail").
# Glossary:
#   broadcast -> campaña            subscriber -> suscriptor (suscriptores)
#   segment -> segmento             sequence -> secuencia
#   template -> plantilla           opt-in form -> formulario de suscripción
#   transactional email -> correo transaccional   email -> correo / correo electrónico
#   email server -> servidor de correo   sender -> remitente
#   sender identity -> identidad de remitente
#   unsubscribe -> darse de baja / baja
#   bounce -> rebote                complaint -> queja (denuncia de spam)
#   suppression list -> lista de exclusión
#   open / click -> apertura / clic tag -> etiqueta  webhook -> webhook
#   access token -> token de acceso API token -> token de API   channel -> canal
#   draft -> borrador   schedule -> programar   send -> enviar
#   test email -> correo de prueba  Test Server / Test Inbox -> Servidor de prueba / Bandeja de prueba
#   Autopilot -> Piloto automático  file asset -> archivo
#   dashboard -> panel              settings -> configuración
#   custom field -> campo personalizado   preheader -> texto de vista previa
#   brand kit -> kit de marca       endpoint -> endpoint
#   topic -> tema
