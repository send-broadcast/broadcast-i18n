        needs_hint_title: "Sin cambios: no se puede saber el orden"
        needs_hint_body_html: "Estos campos contienen fechas como <code>01/02/2026</code>, en las que nada en los datos indica si es el 1 de febrero o el 2 de enero, y ningún otro valor del campo lo aclara. Adivinarlo movería cada una de ellas un mes."
        conflicting_title: "Sin cambios: dos formatos en un mismo campo"
        conflicting_body: "Estos campos contienen fechas con el día primero y con el mes primero, así que ninguna lectura única sirve para todas. La solución es volver a importar la columna indicando su formato."
        uncertain_title: "Sin cambios: más de una respuesta posible"
        uncertain_body: "No se cambiaron porque el valor correcto no era seguro. Decide cada uno tú mismo en lugar de dejar que la reparación adivine."
        collision_title: "Sin cambios: coincidiría con otro suscriptor"
        collision_body: "Al limpiar estas direcciones se obtendría una que ya tiene otro suscriptor. Fusionar dos registros reales es una decisión aparte, así que se omitieron."
        back: "← Volver a mantenimiento"
      tasks:
        custom_data_dates:
          title: "Reparar fechas en campos personalizados"
          description: "Reescribe en formato ISO (2026-01-24) las fechas guardadas en campos personalizados cuando solo hay una lectura posible: espacios de más, ceros que faltan, formatos con el año primero, meses con nombre y valores de día/mes cuyo orden es evidente. Las reglas de segmento solo pueden comparar fechas escritas así."
        segment_rule_values:
          title: "Reparar fechas escritas en reglas de segmento"
          description: "Una regla que compara con una fecha como 24/01/2026 no coincide con nadie y no explica por qué. Esta tarea reescribe esos valores en formato ISO."
        subscriber_emails:
          title: "Limpiar las direcciones de correo de los suscriptores"
          description: "Quita espacios sobrantes y pasa las direcciones a minúsculas para que las búsquedas y las importaciones dejen de pasarlas por alto. Si al limpiarlas aparece la misma dirección dos veces, la copia sin limpiar se desactiva para que la persona no se cuente (ni reciba correos) dos veces; no se elimina nada y su historial indica de qué suscriptor es duplicado. Solo afecta a registros creados antes de que las direcciones se limpiaran automáticamente, así que la mayoría de canales no encontrarán nada."
        whitespace:
          title: "Quitar espacios sobrantes de los datos de suscriptores"
          description: "Elimina los espacios al principio y al final de los nombres y de los valores de campos personalizados. Un valor con un espacio delante no coincidirá con una regla de segmento que lo busque."
        suppression_promotion:
          title: "Copiar las exclusiones de este canal a la lista global"
          description: "Una dirección que rebotó o generó una queja en este canal sigue recibiendo correos cuando la misma persona aparece en otro, lo que perjudica la reputación de envío. Esta tarea copia todas las direcciones de la lista de exclusión de este canal a la lista global, para bloquearlas en todas partes. La lista propia del canal se conserva, y volver a ejecutarla no añade nada."
        postmark_server_names:
          title: "Reparar los nombres de servidores de Postmark"
          description: "Las versiones anteriores enviaban a Postmark un nombre de servidor precedido de \"Postmark - \" y añadían otro prefijo cada vez que se repetía la configuración, de modo que algunos servidores acababan llamándose \"Postmark - Postmark - Acme\". Esta tarea los renombra en Postmark para que coincidan con el nombre que se muestra aquí. Un servidor cuyo nombre en Postmark difiera por cualquier otro motivo puede haberse renombrado allí a propósito, así que se indica en lugar de cambiarse. La mayoría de instalaciones no encontrarán nada."
