        label: "I suoi eventi nei webhook"
        description: "Ti permette di inviare gli eventi di questo plugin ai tuoi endpoint webhook. Non viene inviato nulla finché non attivi un evento per un endpoint. Un webhook contiene l'evento, i suoi campi dichiarati e l'id dell'iscritto, mai un indirizzo email."
      hooks_publicActions:
        label: "Link nelle email che chiunque può cliccare"
        description: "Aggiunge alle email link che eseguono questo plugin quando un iscritto li clicca, senza accesso. Broadcast verifica chi ha cliccato. Il plugin riceve l'iscritto e la scelta contenuta nel link."
      network_private:
        label: "Accesso a un indirizzo privato"
        description: "Si collega a un indirizzo della tua rete privata che approvi tu."
      email_sender:
        label: "Cambiare il mittente"
        description: "Cambia Da o Rispondi a con un mittente verificato in questo canale."
      sql:
        label: "Accesso al database"
      files:
        label: "Accesso ai file"
      env:
        label: "Accesso alle impostazioni del server"
      process:
        label: "Avviare programmi"
      subscribers_resubscribe:
        label: "Iscrivere di nuovo le persone"
      suppressions_write:
        label: "Rimuovere esclusioni"
      email_recipients:
        label: "Cambiare i destinatari delle email"
      email_unsubscribe:
        label: "Cambiare il link di disiscrizione"
