      label: "Endpoint dei plugin"
      hint: "Gli endpoint dell'API dei plugin che questo token può chiamare, uno per riga (plugin/endpoint, oppure plugin/* per tutti). Il token ha anche bisogno del permesso richiesto da ogni endpoint."
      needs: "richiede %{permission}"
    permissions:
      settings:
        label: "Le proprie impostazioni"
        description: "Legge le impostazioni che inserisci per questo plugin, compresi i valori segreti."
      store:
        label: "Il proprio spazio di archiviazione"
        description: "Conserva i propri dati in Broadcast."
      log:
        label: "Log"
        description: "Scrive righe di log che puoi leggere nella pagina del plugin."
      channel:
        label: "Nome del canale"
        description: "Legge il nome del canale in cui viene eseguito."
      events:
        label: "I propri eventi"
        description: "Registra eventi (per esempio ordini) per le sue regole di segmento."
      subscribers_read:
        label: "Leggere gli iscritti"
        description: "Legge i dati, i tag e i campi personalizzati degli iscritti."
      subscribers_write:
        label: "Modificare gli iscritti"
        description: "Modifica nomi, campi personalizzati e altri dati degli iscritti esistenti."
      tags_read:
        label: "Leggere i tag"
        description: "Legge l'elenco dei tag."
      tags_write:
        label: "Modificare i tag"
        description: "Aggiunge tag agli iscritti e li rimuove."
      broadcasts_read:
        label: "Leggere le campagne"
        description: "Legge le campagne e le loro statistiche."
      sequences_read:
        label: "Leggere le sequenze"
        description: "Legge le sequenze e i loro passaggi."
      segments_read:
        label: "Leggere i segmenti"
        description: "Legge i segmenti e le loro regole."
      templates_read:
        label: "Leggere i modelli"
        description: "Legge i nomi, gli oggetti e le prime parole dei tuoi modelli di email."
      network:
        label: "Accesso a Internet"
        description: "Si collega a questi siti: %{hosts}."
      subscribers_export:
        label: "Copiare tutto il tuo elenco"
        description: "Può leggere ogni iscritto, pagina per pagina, e inviarli a %{hosts}."
      subscribers_create:
        label: "Aggiungere nuovi iscritti"
        description: "Aggiunge persone al tuo elenco. Vale la tua impostazione di doppio opt-in."
      network_wildcard:
        label: "Accesso a Internet verso molti siti"
        description: "Si collega a qualsiasi sito che corrisponde a %{hosts}."
      network_fromSetting:
        label: "Accesso a Internet verso un indirizzo che inserisci"
        description: "Si collega all'indirizzo che scrivi nell'impostazione %{setting}."
      output_html:
        label: "HTML nelle email"
        description: "Aggiunge HTML alle email. Broadcast lo ripulisce prima dell'invio."
      hooks_beforeSend:
        label: "Modificare le email prima dell'invio"
        description: "Può saltare un'email o modificarne oggetto e contenuto. Non può cambiare chi la riceve, il mittente o il link di disiscrizione."
