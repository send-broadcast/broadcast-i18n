# Broadcast plugins: plugin screens, permissions and emails, Italian.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.it.yml. bin/check validates the
# file; see CONTRIBUTING.md.
it:
  plugins:
    open_link:
      title: "Aprire questo link?"
      body: "%{plugin} vuole aprire una pagina al di fuori di Broadcast. Controlla l'indirizzo prima di continuare."
      open: "Apri il link"
    editor_insert:
      close: "Chiudi"
      from: "Da %{plugin}"
      cleaned: "Broadcast controlla e pulisce l'HTML prima che entri nell'email."
      group: "Dai plugin"
      menu: "Inserisci da un plugin"
    public_action:
      confirm_title: "Un momento"
      confirm_button: "Continua"
      saving: "Salvataggio…"
      done_title: "Grazie"
      failed_title: "Qualcosa è andato storto"
      failed_body: "Non siamo riusciti a salvare. Riprova il link più tardi."
      test_title: "Questa è un'email di prova"
      test_body: "Il link funziona. Nell'email reale, questo clic viene salvato per la persona che clicca. Ora non è stato salvato nulla."
    developer_token:
      label: "Sviluppatore di plugin"
      hint: "Per un agente IA che scrive plugin: può creare, modificare e testare bozze con dati di prova e inviartele da controllare. Non può leggere dati reali degli iscritti né distribuire. Non può avere altri permessi e scade entro 30 giorni."
