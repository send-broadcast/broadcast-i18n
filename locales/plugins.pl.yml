# Broadcast plugins: plugin screens, permissions and emails, Polish.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.pl.yml. bin/check validates the
# file; see CONTRIBUTING.md.
pl:
  plugins:
    open_link:
      title: "Otworzyć ten link?"
      body: "%{plugin} chce otworzyć stronę poza Broadcast. Sprawdź adres, zanim przejdziesz dalej."
      open: "Otwórz link"
    public_action:
      confirm_title: "Chwileczkę"
      confirm_button: "Dalej"
      done_title: "Dziękujemy"
      failed_title: "Coś poszło nie tak"
      failed_body: "Nie udało się tego zapisać. Spróbuj ponownie użyć linku później."
    developer_token:
      label: "Twórca pluginów"
      hint: "Dla agenta AI, który pisze pluginy: może tworzyć, zmieniać i testować wersje robocze na danych testowych oraz przesyłać je Tobie do przeglądu. Nie może czytać prawdziwych danych subskrybentów ani wdrażać. Nie może mieć innych uprawnień i wygasa w ciągu 30 dni."
    webhook_endpoints:
      title: "Zdarzenia pluginów"
      hint: "Wysyłane tylko dla zdarzeń zaznaczonych tutaj. Opcja Zaznacz wszystkie ich nie obejmuje."
      not_available: "ma zdarzenie pluginu, które nie jest dostępne w tym kanale"
    token_endpoints:
      label: "Endpointy pluginów"
      hint: "Endpointy API pluginów, które ten token może wywoływać, po jednym w wierszu (plugin/endpoint lub plugin/* dla wszystkich). Token potrzebuje też uprawnienia, którego wymaga każdy endpoint."
      needs: "wymaga %{permission}"
    permissions:
      settings:
        label: "Własne ustawienia"
        description: "Odczytuje ustawienia, które wpisujesz dla tego pluginu, w tym wartości tajne."
      store:
        label: "Własny magazyn"
        description: "Przechowuje własne dane w Broadcast."
      log:
        label: "Logi"
        description: "Zapisuje wiersze logów, które możesz czytać na stronie pluginu."
      channel:
        label: "Nazwa kanału"
        description: "Odczytuje nazwę kanału, w którym działa."
      events:
        label: "Własne zdarzenia"
        description: "Rejestruje zdarzenia (na przykład zamówienia) dla swoich reguł segmentów."
      subscribers_read:
        label: "Odczyt subskrybentów"
        description: "Odczytuje dane subskrybentów, tagi i pola niestandardowe."
      subscribers_write:
        label: "Zmiana subskrybentów"
        description: "Zmienia imiona, pola niestandardowe i inne dane istniejących subskrybentów."
      tags_read:
        label: "Odczyt tagów"
        description: "Odczytuje listę tagów."
      tags_write:
        label: "Zmiana tagów"
        description: "Dodaje tagi subskrybentom i je usuwa."
      broadcasts_read:
        label: "Odczyt kampanii"
        description: "Odczytuje kampanie i ich statystyki."
      sequences_read:
        label: "Odczyt sekwencji"
        description: "Odczytuje sekwencje i ich kroki."
      segments_read:
        label: "Odczyt segmentów"
        description: "Odczytuje segmenty i ich reguły."
      network:
        label: "Dostęp do internetu"
        description: "Łączy się z tymi witrynami: %{hosts}."
      subscribers_export:
        label: "Kopiowanie całej listy"
        description: "Może odczytać każdego subskrybenta, strona po stronie, i wysłać ich do %{hosts}."
      subscribers_create:
        label: "Dodawanie nowych subskrybentów"
        description: "Dodaje osoby do Twojej listy. Obowiązuje Twoje ustawienie podwójnej zgody (double opt-in)."
      network_wildcard:
        label: "Dostęp do internetu do wielu witryn"
        description: "Łączy się z każdą witryną pasującą do %{hosts}."
      network_fromSetting:
        label: "Dostęp do internetu do adresu, który wpiszesz"
        description: "Łączy się z adresem wpisanym w ustawieniu %{setting}."
      output_html:
        label: "HTML w e-mailach"
        description: "Dodaje HTML do e-maili. Broadcast oczyszcza go przed wysłaniem."
      hooks_beforeSend:
        label: "Zmiana e-maili przed wysłaniem"
        description: "Może pominąć e-mail albo zmienić jego temat i treść. Nie może zmienić odbiorcy, nadawcy ani linku do wypisania się."
      hooks_apiEndpoints:
        label: "Własne API"
        description: "Dodaje adresy API, z których mogą korzystać wywołujący z pasującym tokenem API."
      events_webhook:
        label: "Własne zdarzenia w webhookach"
        description: "Pozwala wysyłać zdarzenia tego pluginu do Twoich endpointów webhooków. Nic nie jest wysyłane, dopóki nie włączysz zdarzenia dla endpointu. Webhook zawiera zdarzenie, jego zadeklarowane pola i id subskrybenta, nigdy adres e-mail."
      hooks_publicActions:
        label: "Linki w e-mailach, które każdy może kliknąć"
        description: "Dodaje do e-maili linki, które uruchamiają ten plugin, gdy subskrybent je kliknie, bez logowania. Broadcast potwierdza, kto kliknął. Plugin otrzymuje subskrybenta i wybór zapisany w linku."
      network_private:
        label: "Dostęp do jednego adresu prywatnego"
        description: "Łączy się z jednym adresem w Twojej sieci prywatnej, który zatwierdzisz."
      email_sender:
        label: "Zmiana nadawcy"
        description: "Zmienia pole Od lub Odpowiedz do na nadawcę zweryfikowanego w tym kanale."
      sql:
        label: "Dostęp do bazy danych"
      files:
        label: "Dostęp do plików"
      env:
        label: "Dostęp do ustawień serwera"
      process:
        label: "Uruchamianie programów"
      subscribers_resubscribe:
        label: "Ponowne zapisywanie osób"
      suppressions_write:
        label: "Usuwanie wykluczeń"
      email_recipients:
        label: "Zmiana odbiorców e-maili"
      email_unsubscribe:
        label: "Zmiana linku do wypisania się"
