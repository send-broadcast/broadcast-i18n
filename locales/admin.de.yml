# Broadcast admin interface: German.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Style: formal "Sie", German capitalisation, otherwise sentence case,
# hyphenated compounds with English or brand words (E-Mail-Adresse,
# API-Schlüssel), German date order (5. Jan. 2026) and the 24-hour clock.
# Glossary, so one thing keeps one name everywhere:
#   broadcast -> Kampagne           subscriber -> Abonnent
#   segment -> Segment              sequence -> Sequenz
#   template -> Vorlage             opt-in form -> Anmeldeformular
#   transactional email -> Transaktions-E-Mail
#   email server -> E-Mail-Server   sender -> Absender
#   sender identity -> Absenderidentität
#   unsubscribe -> abmelden / Abmeldung
#   bounce -> Bounce                complaint -> Beschwerde
#   suppression list -> Sperrliste  (one entry: Sperre)
#   open / click -> Öffnung / Klick   tag -> Tag   webhook -> Webhook
#   access token -> Zugriffstoken   API token -> API-Token   channel -> Kanal
#   draft -> Entwurf   schedule -> planen   send -> senden
#   test email -> Test-E-Mail       Test Server / Test Inbox -> Testserver / Test-Posteingang
#   Autopilot -> Autopilot          file asset -> Datei
#   brand kit -> Markenkit          preheader -> Vorschautext
#   custom field -> benutzerdefiniertes Feld   Ask AI -> KI fragen
#   topic -> Thema
