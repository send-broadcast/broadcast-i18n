        confirm_rewrite: "Sie werden um Bestätigung gebeten, da dies nicht rückgängig gemacht werden kann."
        needs_hint_title: "Unverändert: Die Reihenfolge ist nicht bestimmbar"
        needs_hint_body_html: "Diese Felder enthalten Datumsangaben wie <code>01/02/2026</code>, bei denen nichts in den Daten verrät, ob der 1. Februar oder der 2. Januar gemeint ist, und kein anderer Wert im Feld klärt das. Raten würde jedes dieser Daten um einen Monat verschieben."
        conflicting_title: "Unverändert: zwei Formate in einem Feld"
        conflicting_body: "Diese Felder enthalten sowohl Datumsangaben mit Tag zuerst als auch mit Monat zuerst, sodass keine einheitliche Lesart für alle stimmt. Abhilfe schafft ein erneuter Import der Spalte mit angegebenem Format."
        uncertain_title: "Unverändert: mehr als eine mögliche Lösung"
        uncertain_body: "Diese Werte wurden nicht geändert, weil der richtige Wert nicht sicher war. Entscheiden Sie jeden selbst, statt die Reparatur raten zu lassen."
        collision_title: "Unverändert: Konflikt mit einem anderen Abonnenten"
        collision_body: "Das Bereinigen dieser Adressen würde eine Adresse ergeben, die bereits ein anderer Abonnent hat. Das Zusammenführen zweier echter Datensätze ist eine eigene Entscheidung, daher wurden sie übersprungen."
        back: "← Zurück zur Wartung"
      tasks:
        custom_data_dates:
          title: "Datumsangaben in benutzerdefinierten Feldern reparieren"
          description: "Schreibt Datumsangaben in benutzerdefinierten Feldern im ISO-Format (2026-01-24) um, wo immer es nur eine mögliche Lesart gibt: überzählige Leerzeichen, fehlende Nullen, Formate mit Jahr zuerst, ausgeschriebene Monate und Tag/Monat-Werte, deren Reihenfolge eindeutig ist. Segmentregeln können nur so geschriebene Datumsangaben vergleichen."
        segment_rule_values:
          title: "In Segmentregeln eingegebene Datumsangaben reparieren"
          description: "Eine Regel, die mit einem Datum wie 24/01/2026 vergleicht, trifft auf niemanden zu und verrät nicht, warum. Diese Aufgabe schreibt solche Werte im ISO-Format um."
        subscriber_emails:
          title: "E-Mail-Adressen von Abonnenten bereinigen"
          description: "Entfernt überzählige Leerzeichen und schreibt Adressen klein, damit sie bei Suchen und Importen nicht mehr übersehen werden. Ergibt die Bereinigung dieselbe Adresse doppelt, wird die unbereinigte Kopie deaktiviert, damit die Person nicht doppelt gezählt (oder angeschrieben) wird; gelöscht wird nichts, und ihr Verlauf zeigt, welchen Abonnenten sie dupliziert. Betrifft nur Datensätze, die angelegt wurden, bevor Adressen automatisch bereinigt wurden, daher finden die meisten Kanäle nichts."
        whitespace:
          title: "Überzählige Leerzeichen aus Abonnentendaten entfernen"
          description: "Entfernt Leerzeichen am Anfang und Ende von Namen und Werten benutzerdefinierter Felder. Ein Wert mit vorangestelltem Leerzeichen passt nicht zu einer Segmentregel, die nach ihm sucht."
        suppression_promotion:
          title: "Sperren dieses Kanals in die globale Liste kopieren"
          description: "Eine Adresse, die in diesem Kanal gebounced ist oder sich beschwert hat, wird weiterhin angeschrieben, wenn dieselbe Person in einem anderen Kanal auftaucht, was der Absenderreputation schadet. Diese Aufgabe kopiert jede Adresse von der Sperrliste dieses Kanals in die globale Liste, sodass sie überall gesperrt ist. Die eigene Liste des Kanals bleibt erhalten, und eine erneute Ausführung fügt nichts hinzu."
        postmark_server_names:
          title: "Namen der Postmark-Server reparieren"
          description: "Frühere Versionen haben Postmark einen Servernamen mit vorangestelltem „Postmark - “ übermittelt und bei jeder erneuten Einrichtung ein weiteres Präfix ergänzt, sodass Server schließlich „Postmark - Postmark - Acme“ hießen. Diese Aufgabe benennt sie in Postmark so um, wie sie hier angezeigt werden. Ein Server, dessen Name in Postmark aus einem anderen Grund abweicht, wurde dort möglicherweise absichtlich umbenannt; er wird daher gemeldet statt geändert. Die meisten Installationen finden nichts."
