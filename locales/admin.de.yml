    autopilot_presets:
      tech:
        tone: "Technisch und informativ, aber verständlich. Komplexe Themen in klarer Sprache erklären. Wo sinnvoll, Code-Beispiele oder technische Details einbinden. Einen professionellen und zugleich zugänglichen Ton wählen, den Entwickler schätzen."
        content: "Schwerpunkte: neue Releases, Breaking Changes, Sicherheitsupdates, Leistungsverbesserungen und Entwicklerwerkzeuge. Umsetzbare Informationen haben Vorrang. Links zur Dokumentation und zu relevanten Ressourcen einfügen."
        structure: "## 🚀 Neuigkeiten\n\n{new_releases}\n\n## ⚠️ Breaking Changes\n\n{breaking_changes}\n\n## 🔧 Fehlerbehebungen und Verbesserungen\n\n{fixes}\n\n## 📚 Lesenswert\n\n{articles}\n\n## 📅 Demnächst\n\n{upcoming}"
      company:
        tone: "Professionell, herzlich und selbstbewusst. Wie ein vertrauenswürdiger Partner berichten, der Neuigkeiten teilt. Informativ und zugleich persönlich sein. Unternehmensjargon vermeiden, menschlich und authentisch bleiben."
        content: "Meilensteine des Unternehmens, Produkt-Updates, Neuigkeiten aus dem Team und Erfolgsgeschichten von Kunden hervorheben. Mit den wichtigsten Neuigkeiten beginnen. Wo passend, klare Handlungsaufforderungen einfügen."
        structure: "## Hallo vom Team\n\n{intro}\n\n## Produkt-Updates\n\n{updates}\n\n## Neues aus dem Unternehmen\n\n{news}\n\n## Kunden im Fokus\n\n{spotlight}\n\n## Was als Nächstes kommt\n\n{roadmap}"
      community:
        tone: "Freundlich, begeistert und inklusiv. Beiträge aus der Community würdigen und Verbindungen fördern. Eine lockere Sprache mit gelegentlichem Humor verwenden. Den Lesern das Gefühl geben, geschätzte Mitglieder der Community zu sein."
        content: "Beiträge aus der Community vorstellen, Erfolge von Mitgliedern hervorheben, anstehende Events teilen und zum Mitmachen ermutigen. Vielfältige Stimmen und Perspektiven aus der Community einbeziehen."
        structure: "## 👋 Hallo Community!\n\n{greeting}\n\n## 🌟 Community-Highlights\n\n{highlights}\n\n## 🎉 Mitglied im Fokus\n\n{spotlight}\n\n## 📆 Anstehende Events\n\n{events}\n\n## 💬 Diskussion der Woche\n\n{discussion}\n\n## 🙌 Machen Sie mit\n\n{cta}"
      changelog:
        tone: "Klar, prägnant und sachlich. Darauf konzentrieren, was sich geändert hat und warum es für Nutzer wichtig ist. Aufzählungspunkte für schnelles Überfliegen verwenden. Verbesserungen und bekannte Probleme direkt benennen."
        content: "Gliedern nach: neue Funktionen, Verbesserungen, Fehlerbehebungen und veraltete Funktionen. Wo zutreffend, Versionsnummern angeben. Bei komplexen Änderungen auf die ausführliche Dokumentation verlinken."
        structure: "## Version {version} ({date})\n\n### ✨ Neue Funktionen\n\n{features}\n\n### 🔄 Verbesserungen\n\n{improvements}\n\n### 🐛 Fehlerbehebungen\n\n{fixes}\n\n### ⚠️ Veraltete Funktionen\n\n{deprecations}\n\n### 📝 Hinweise\n\n{notes}"
      curated:
        tone: "Durchdacht und meinungsstark, wie ein kundiger Freund, der Fundstücke teilt. Zu jedem Link einen kurzen, aber aufschlussreichen Kommentar geben. Wählerisch sein: Qualität vor Quantität."
        content: "Die interessantesten und wertvollsten Links auswählen. Nach Thema oder Kategorie gruppieren. Einen persönlichen Kommentar ergänzen, warum sich jeder Link lohnt. Eine Mischung aus Artikeln, Tools und Ressourcen aufnehmen."
        structure: "## Unsere Auswahl der Woche\n\n{intro}\n\n### 📖 Pflichtlektüre\n\n{must_read}\n\n### 🛠 Tools und Ressourcen\n\n{tools}\n\n### 💡 Ideen und Inspiration\n\n{ideas}\n\n### 🎯 Kurz verlinkt\n\n{quick_links}\n\n---\n\n*Etwas Tolles entdeckt? Antworten Sie einfach und teilen Sie es mit uns!*"
      industry:
        tone: "Fundiert, aber verständlich. Analysen und Zusammenhänge liefern, nicht nur Nachrichten. Den Lesern helfen zu verstehen, warum Entwicklungen wichtig sind. Tiefe und Lesbarkeit ausbalancieren."
        content: "Wichtige Branchennachrichten, Trends und Analysen abdecken. Kontext und Auswirkungen erläutern. Wo verfügbar, Expertenmeinungen und Daten einbeziehen. Zusammenhänge zwischen verschiedenen Entwicklungen herstellen."
        structure: "## Branchen-Puls\n\n{summary}\n\n## 📰 Top-Meldungen\n\n{stories}\n\n## 📊 In Zahlen\n\n{data}\n\n## 🔮 Analysen und Trends\n\n{analysis}\n\n## 👀 Im Blick behalten\n\n{watch}\n\n## 💭 Unsere Einschätzung\n\n{opinion}"
