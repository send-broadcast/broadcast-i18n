      label: "Pluginontwikkelaar"
      hint: "Voor een AI-agent die plugins schrijft: hij kan concepten met testgegevens maken, wijzigen en testen, en ze ter beoordeling aan jou voorleggen. Hij kan geen echte abonneegegevens lezen en niets uitrollen. Hij kan geen andere rechten hebben en verloopt binnen 30 dagen."
