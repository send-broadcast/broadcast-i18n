    permissions:
      settings:
        label: "Eigen instellingen"
        description: "Leest de instellingen die je voor deze plugin invult, ook geheime waarden."
      store:
        label: "Eigen opslag"
        description: "Bewaart eigen gegevens in Broadcast."
      log:
        label: "Logs"
        description: "Schrijft logregels die je op de pluginpagina kunt lezen."
      channel:
        label: "Kanaalnaam"
        description: "Leest de naam van het kanaal waarin de plugin draait."
      events:
        label: "Eigen gebeurtenissen"
        description: "Legt gebeurtenissen vast (bijvoorbeeld bestellingen) voor de eigen segmentregels."
      subscribers_read:
        label: "Abonnees lezen"
        description: "Leest abonneegegevens, tags en aangepaste velden."
      subscribers_write:
        label: "Abonnees wijzigen"
        description: "Wijzigt namen, aangepaste velden en andere gegevens van bestaande abonnees."
      tags_read:
        label: "Tags lezen"
        description: "Leest de lijst met tags."
      tags_write:
        label: "Tags wijzigen"
        description: "Voegt tags toe aan abonnees en verwijdert ze."
      broadcasts_read:
        label: "Campagnes lezen"
        description: "Leest campagnes en hun statistieken."
      sequences_read:
        label: "Reeksen lezen"
        description: "Leest reeksen en hun stappen."
      segments_read:
        label: "Segmenten lezen"
        description: "Leest segmenten en hun regels."
      templates_read:
        label: "Sjablonen lezen"
        description: "Leest de namen, de onderwerpregels en de eerste woorden van je e-mailsjablonen."
