        label: "Eigen gebeurtenissen in webhooks"
        description: "Laat je gebeurtenissen van deze plugin naar je webhook-endpoints sturen. Er wordt niets verzonden totdat je een gebeurtenis voor een endpoint inschakelt. Een webhook bevat de gebeurtenis, de gedeclareerde velden en de abonnee-id, nooit een e-mailadres."
      hooks_publicActions:
        label: "Links in e-mails waarop iedereen kan klikken"
        description: "Voegt links toe aan e-mails die deze plugin uitvoeren wanneer een abonnee erop klikt, zonder inloggen. Broadcast bewijst wie er klikte. De plugin krijgt de abonnee en de keuze in de link."
      network_private:
        label: "Toegang tot één privéadres"
        description: "Maakt verbinding met één adres in je privénetwerk dat jij goedkeurt."
      email_sender:
        label: "Afzender wijzigen"
        description: "Wijzigt Van of Antwoord aan naar een afzender die in dit kanaal geverifieerd is."
      sql:
        label: "Databasetoegang"
      files:
        label: "Bestandstoegang"
      env:
        label: "Toegang tot serverinstellingen"
      process:
        label: "Programma's starten"
