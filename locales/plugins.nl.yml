        label: "Nieuwe abonnees toevoegen"
        description: "Voegt mensen toe aan je lijst. Je dubbele opt-in-instelling geldt."
      network_wildcard:
        label: "Internettoegang tot veel sites"
        description: "Maakt verbinding met elke site die past bij %{hosts}."
      network_fromSetting:
        label: "Internettoegang tot een adres dat je invult"
        description: "Maakt verbinding met het adres dat je in de instelling %{setting} typt."
      output_html:
        label: "HTML in e-mails"
        description: "Voegt HTML toe aan e-mails. Broadcast schoont het op voordat het wordt verzonden."
      hooks_beforeSend:
        label: "E-mails wijzigen voordat ze worden verzonden"
