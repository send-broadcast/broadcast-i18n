# Broadcast plugins: plugin screens, permissions and emails, Norwegian Bokmål.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.nb.yml. bin/check validates the
# file; see CONTRIBUTING.md.
nb:
  plugins:
    open_link:
      title: "Åpne denne lenken?"
      body: "%{plugin} vil åpne en side utenfor Broadcast. Sjekk adressen før du fortsetter."
      open: "Åpne lenken"
    editor_insert:
      close: "Lukk"
      from: "Fra %{plugin}"
      cleaned: "Broadcast kontrollerer og renser HTML-koden før den settes inn i e-posten."
      group: "Fra programtillegg"
      menu: "Sett inn fra et programtillegg"
    public_action:
      confirm_title: "Et øyeblikk"
      confirm_button: "Fortsett"
      saving: "Lagrer…"
      done_title: "Takk"
      own_answer: "Ditt svar"
      form_submit: "Send"
      failed_title: "Noe gikk galt"
      failed_body: "Vi kunne ikke lagre dette. Prøv lenken igjen senere."
      test_title: "Dette er en test-e-post"
      test_body: "Lenken virker. I den ekte e-posten lagres dette klikket for personen som klikker. Ingenting ble lagret nå."
    developer_token:
      label: "Plugin-utvikler"
      hint: "For en KI-agent som skriver pluginer: den kan opprette, endre og teste utkast med testdata og sende dem til deg for gjennomgang. Den kan ikke lese ekte abonnentdata eller rulle ut. Den kan ikke ha andre tillatelser og utløper innen 30 dager."
    webhook_endpoints:
      title: "Plugin-hendelser"
      hint: "Sendes bare for hendelsene du krysser av for her. Velg alle tar dem ikke med."
      not_available: "har en plugin-hendelse som ikke er tilgjengelig i denne kanalen"
    token_endpoints:
      label: "Plugin-endepunkter"
      hint: "Endepunktene i plugin-API-et som dette tokenet kan kalle, ett per linje (plugin/endepunkt, eller plugin/* for alle). Tokenet trenger også tillatelsen hvert endepunkt krever."
      needs: "krever %{permission}"
    permissions:
      settings:
        label: "Egne innstillinger"
        description: "Leser innstillingene du oppgir for denne pluginen, også hemmelige verdier."
      store:
        label: "Egen lagring"
        description: "Lagrer egne data i Broadcast."
      log:
        label: "Logger"
        description: "Skriver logglinjer som du kan lese på pluginens side."
      channel:
        label: "Kanalnavn"
        description: "Leser navnet på kanalen den kjører i."
      events:
        label: "Egne hendelser"
        description: "Registrerer hendelser (for eksempel bestillinger) for sine segmentregler."
      subscribers_read:
        label: "Lese abonnenter"
        description: "Leser abonnentopplysninger, tagger og egendefinerte felt."
      subscribers_write:
        label: "Endre abonnenter"
        description: "Endrer navn, egendefinerte felt og andre opplysninger om eksisterende abonnenter."
      tags_read:
        label: "Lese tagger"
        description: "Leser listen over tagger."
      tags_write:
        label: "Endre tagger"
        description: "Legger til tagger på abonnenter og fjerner dem."
      broadcasts_read:
        label: "Lese kampanjer"
        description: "Leser kampanjer og statistikken deres."
      sequences_read:
        label: "Lese sekvenser"
        description: "Leser sekvenser og trinnene deres."
      segments_read:
        label: "Lese segmenter"
        description: "Leser segmenter og reglene deres."
      templates_read:
        label: "Lese maler"
        description: "Leser navnene, emnelinjene og de første ordene i e-postmalene dine."
      network:
        label: "Internett-tilgang"
        description: "Kobler til disse nettstedene: %{hosts}."
      subscribers_export:
        label: "Kopiere hele listen din"
        description: "Kan lese alle abonnenter, side for side, og sende dem til %{hosts}."
      subscribers_create:
        label: "Legge til nye abonnenter"
        description: "Legger til personer i listen din. Innstillingen din for dobbel opt-in gjelder."
      network_wildcard:
        label: "Internett-tilgang til mange nettsteder"
        description: "Kobler til alle nettsteder som samsvarer med %{hosts}."
      network_fromSetting:
        label: "Internett-tilgang til en adresse du oppgir"
        description: "Kobler til adressen du skriver inn i innstillingen %{setting}."
      output_html:
        label: "HTML i e-poster"
        description: "Legger til HTML i e-poster. Broadcast renser den før den sendes."
      hooks_beforeSend:
        label: "Endre e-poster før de sendes"
        description: "Kan hoppe over en e-post eller endre emnet og innholdet. Den kan ikke endre hvem som mottar den, avsenderen eller avmeldingslenken."
