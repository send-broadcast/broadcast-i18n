        label: "Eget API"
        description: "Legger til API-adresser som kan brukes av de som har et samsvarende API-token."
      events_webhook:
        label: "Egne hendelser i webhooks"
        description: "Lar deg sende hendelser fra denne pluginen til webhook-endepunktene dine. Ingenting sendes før du slår på en hendelse for et endepunkt. En webhook inneholder hendelsen, de deklarerte feltene og abonnentens id, aldri en e-postadresse."
      hooks_publicActions:
        label: "Lenker i e-poster som alle kan klikke på"
        description: "Legger til lenker i e-poster som kjører denne pluginen når en abonnent klikker på dem, uten innlogging. Broadcast beviser hvem som klikket. Pluginen får abonnenten og valget i lenken."
      network_private:
        label: "Tilgang til én privat adresse"
        description: "Kobler til én adresse i det private nettverket ditt som du godkjenner."
      email_sender:
        label: "Endre avsenderen"
        description: "Endrer Fra eller Svar til til en avsender som er verifisert i denne kanalen."
      sql:
        label: "Databasetilgang"
      files:
        label: "Filtilgang"
      env:
        label: "Tilgang til serverinnstillinger"
      process:
        label: "Starte programmer"
