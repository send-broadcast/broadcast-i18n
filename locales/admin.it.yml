      tasks:
        custom_data_dates:
          title: "Correggi le date nei campi personalizzati"
          description: "Riscrive in formato ISO (2026-01-24) le date salvate nei campi personalizzati ovunque ci sia una sola lettura possibile: spazi in più, zeri mancanti, formati con l’anno prima, mesi scritti per nome e valori giorno/mese che dimostrano da soli il loro ordine. Le regole dei segmenti possono confrontare solo date scritte in questo modo."
        segment_rule_values:
          title: "Correggi le date inserite nelle regole dei segmenti"
          description: "Una regola che confronta con una data come 24/01/2026 non trova nessuno e non dice perché. Questa attività riscrive quei valori in formato ISO."
        subscriber_emails:
          title: "Riordina gli indirizzi email degli iscritti"
          description: "Rimuove gli spazi superflui e converte gli indirizzi in minuscolo, così ricerche e importazioni non li perdono più. Se il riordino rivela lo stesso indirizzo due volte, la copia non riordinata viene disattivata, così la persona non viene contata (o contattata) due volte; nulla viene eliminato e il suo storico indica quale iscritto duplica. Riguarda solo i record scritti prima che gli indirizzi venissero riordinati automaticamente, quindi la maggior parte dei canali non troverà nulla."
        whitespace:
          title: "Rimuovi gli spazi superflui dai dati degli iscritti"
          description: "Rimuove gli spazi all’inizio e alla fine dei nomi e dei valori dei campi personalizzati. Un valore preceduto da uno spazio non corrisponde a una regola di segmento che lo cerca."
        suppression_promotion:
          title: "Copia le esclusioni di questo canale nella lista globale"
          description: "Un indirizzo che ha avuto un mancato recapito o una segnalazione di spam in questo canale riceve ancora email quando la stessa persona compare in un altro, e questo danneggia la reputazione di invio. Questa attività copia ogni indirizzo della lista di esclusione di questo canale nella lista globale, così viene bloccato ovunque. La lista del canale resta com’è, e rieseguirla non aggiunge nulla."
        postmark_server_names:
          title: "Correggi i nomi dei server Postmark"
          description: "Le versioni precedenti inviavano a Postmark un nome del server preceduto da \"Postmark - \" e aggiungevano un altro prefisso a ogni nuova configurazione, così i server finivano per chiamarsi \"Postmark - Postmark - Acme\". Questa attività li rinomina in Postmark perché corrispondano al nome mostrato qui. Un server il cui nome in Postmark differisce per altri motivi potrebbe essere stato rinominato lì di proposito, quindi viene segnalato invece che modificato. La maggior parte delle installazioni non troverà nulla."
