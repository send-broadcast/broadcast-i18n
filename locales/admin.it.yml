# Broadcast admin interface: Italian.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Style: informal "tu", sentence case, Italian date order (5 gen 2026) and the
# 24-hour clock. Glossary, so one thing keeps one name everywhere:
#   broadcast -> campagna          subscriber -> iscritto
#   segment -> segmento            sequence -> sequenza
#   template -> modello            opt-in form -> modulo di iscrizione
#   transactional email -> email transazionale
#   email server -> server email   sender -> mittente
#   unsubscribe -> annullare l'iscrizione / disiscrizione
#   bounce -> mancato recapito     complaint -> segnalazione di spam
#   suppression list -> lista di esclusione
#   open / click -> apertura / clic   tag -> tag   webhook -> webhook
#   access token -> token di accesso  channel -> canale
#   draft -> bozza   schedule -> programmare   send -> inviare
#   test email -> email di prova     Test Server / Test Inbox -> Server di test / Casella di test
#   Autopilot -> Pilota automatico    file asset -> file
#   topic -> argomento

