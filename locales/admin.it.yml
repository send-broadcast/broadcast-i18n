        content: "Concentrati su: nuove versioni, modifiche incompatibili, aggiornamenti di sicurezza, miglioramenti delle prestazioni e strumenti per sviluppatori. Dai priorità alle informazioni utili in pratica. Includi link alla documentazione e alle risorse pertinenti."
        structure: "## 🚀 Novità\n\n{new_releases}\n\n## ⚠️ Modifiche incompatibili\n\n{breaking_changes}\n\n## 🔧 Correzioni e miglioramenti\n\n{fixes}\n\n## 📚 Da leggere\n\n{articles}\n\n## 📅 In arrivo\n\n{upcoming}"
      company:
        tone: "Professionale, caloroso e sicuro. Parla come un partner di fiducia che condivide novità. Bilancia informazione e tono personale. Evita il gergo aziendale: sii umano e autentico."
        content: "Metti in evidenza traguardi dell'azienda, novità di prodotto, notizie dal team e storie di successo dei clienti. Apri con la notizia di maggiore impatto. Includi inviti all'azione chiari quando servono."
        structure: "## Un saluto dal team\n\n{intro}\n\n## Novità di prodotto\n\n{updates}\n\n## Notizie dall'azienda\n\n{news}\n\n## In primo piano: i clienti\n\n{spotlight}\n\n## Cosa arriva\n\n{roadmap}"
      community:
        tone: "Amichevole, entusiasta e inclusivo. Celebra i contributi della community e crea legami. Usa un linguaggio colloquiale e un po' di umorismo ogni tanto. Fai sentire i lettori membri preziosi della community."
        content: "Mostra i contributi della community, evidenzia i risultati dei membri, condividi i prossimi eventi e incoraggia la partecipazione. Dai spazio a voci e prospettive diverse della community."
        structure: "## 👋 Ciao community!\n\n{greeting}\n\n## 🌟 Il meglio della community\n\n{highlights}\n\n## 🎉 In primo piano: i membri\n\n{spotlight}\n\n## 📆 Prossimi eventi\n\n{events}\n\n## 💬 La discussione della settimana\n\n{discussion}\n\n## 🙌 Partecipa\n\n{cta}"
      changelog:
        tone: "Chiaro, conciso e concreto. Concentrati su cosa è cambiato e perché conta per gli utenti. Usa elenchi puntati per una lettura rapida. Sii diretto sia sui miglioramenti sia sui problemi noti."
        content: "Organizza per: nuove funzioni, miglioramenti, correzioni di bug e funzioni deprecate. Includi i numeri di versione quando servono. Aggiungi link alla documentazione dettagliata per le modifiche complesse."
        structure: "## Versione {version} - {date}\n\n### ✨ Nuove funzioni\n\n{features}\n\n### 🔄 Miglioramenti\n\n{improvements}\n\n### 🐛 Correzioni di bug\n\n{fixes}\n\n### ⚠️ Funzioni deprecate\n\n{deprecations}\n\n### 📝 Note\n\n{notes}"
      curated:
        tone: "Riflessivo e con opinioni, come un amico competente che condivide le sue scoperte. Aggiungi a ogni link un commento breve ma acuto. Sii selettivo: meglio la qualità della quantità."
        content: "Seleziona i link più interessanti e utili. Raggruppali per tema o categoria. Aggiungi un commento personale che spieghi perché vale la pena leggere ciascun link. Includi un mix di articoli, strumenti e risorse."
        structure: "## I consigli della settimana\n\n{intro}\n\n### 📖 Da non perdere\n\n{must_read}\n\n### 🛠 Strumenti e risorse\n\n{tools}\n\n### 💡 Idee e ispirazione\n\n{ideas}\n\n### 🎯 Link veloci\n\n{quick_links}\n\n---\n\n*Hai trovato qualcosa di bello? Rispondi per condividerlo!*"
