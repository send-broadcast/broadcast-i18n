        identity_email_title: "Adresse d'expédition"
        identity_email_body_html: "La bonne pratique consiste à utiliser un sous-domaine dédié par type d'e-mail (<span class=\"font-medium\">send.</span> pour le transactionnel, <span class=\"font-medium\">news.</span> pour le marketing), afin qu'une campagne sujette aux plaintes ne puisse jamais nuire à la délivrabilité de vos factures."
        identity_email_verify: "Les nouvelles adresses doivent être vérifiées auprès de votre fournisseur avant d'être utiles ; les badges de chaque identité indiquent où elle en est."
        footer_title: "À propos du pied de page"
        footer_body: "Ajouté à chaque campagne et e-mail de séquence (les e-mails transactionnels le contrôlent message par message). C'est là que se trouvent le lien de désabonnement et votre adresse postale."
        footer_html_title: "HTML du pied de page"
