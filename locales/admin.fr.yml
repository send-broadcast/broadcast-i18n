# Broadcast admin interface: French.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Style: formal "vous", sentence case, "e-mail" (plural "e-mails"), a space
# before : ; ! ? and « » quotes, French date order (5 janv. 2026) and the
# 24-hour clock. Glossary, so one thing keeps one name everywhere:
#   broadcast -> campagne           subscriber -> abonné
#   segment -> segment              sequence -> séquence
#   template -> modèle              opt-in form -> formulaire d'inscription
#   transactional email -> e-mail transactionnel
#   email server -> serveur e-mail  sender -> expéditeur
#   sender identity -> identité d'expéditeur
#   unsubscribe -> se désabonner / désabonnement
#   bounce -> rebond                complaint -> plainte
#   suppression list -> liste d'exclusion
#   open / click -> ouverture / clic   tag -> tag   webhook -> webhook
#   access token -> jeton d'accès   API token -> jeton API   channel -> canal
#   draft -> brouillon   schedule -> programmer   send -> envoyer
#   test email -> e-mail de test    Test Server / Test Inbox -> Serveur de test / Boîte de test
#   Autopilot -> Pilote automatique   file asset -> fichier
#   brand kit -> charte graphique   preheader -> texte d'aperçu
#   custom field -> champ personnalisé   endpoint -> point de terminaison
#   topic -> thème
