        needs_hint_title: "Laissées telles quelles : l'ordre ne peut pas être déterminé"
        needs_hint_body_html: "Ces champs contiennent des dates comme <code>01/02/2026</code>, pour lesquelles rien dans les données n'indique s'il s'agit du 1er février ou du 2 janvier, et aucune autre valeur du champ ne permet de trancher. Deviner décalerait chacune d'elles d'un mois."
        conflicting_title: "Laissées telles quelles : deux formats dans un même champ"
        conflicting_body: "Ces champs contiennent à la fois des dates au format jour/mois et mois/jour : aucune lecture unique ne convient à toutes. La solution est de réimporter la colonne en déclarant son format."
        uncertain_title: "Laissées telles quelles : plusieurs réponses possibles"
        uncertain_body: "Ces valeurs n'ont pas été modifiées car la bonne valeur n'était pas certaine. Tranchez vous-même plutôt que de laisser la réparation deviner."
        collision_title: "Laissées telles quelles : conflit avec un autre abonné"
        collision_body: "Nettoyer ces adresses produirait une adresse déjà utilisée par un autre abonné. Fusionner deux vrais enregistrements est une décision à part : elles ont donc été ignorées."
        back: "← Retour à la maintenance"
      tasks:
        custom_data_dates:
          title: "Réparer les dates des champs personnalisés"
          description: "Réécrit au format ISO (2026-01-24) les dates stockées dans les champs personnalisés lorsqu'une seule lecture est possible : espaces en trop, zéros manquants, formats commençant par l'année, mois en toutes lettres et valeurs jour/mois dont l'ordre est évident. Les règles de segment ne peuvent comparer que des dates écrites ainsi."
        segment_rule_values:
          title: "Réparer les dates saisies dans les règles de segment"
          description: "Une règle comparant avec une date comme 24/01/2026 ne correspond à personne, sans aucune indication. Cette tâche réécrit ces valeurs au format ISO."
        subscriber_emails:
          title: "Nettoyer les adresses e-mail des abonnés"
          description: "Supprime les espaces parasites et met les adresses en minuscules pour que les recherches et imports ne les manquent plus. Si le nettoyage fait apparaître deux fois la même adresse, la copie mal formée est désactivée pour que la personne ne soit pas comptée (ni contactée) deux fois ; rien n'est supprimé, et son historique indique de quel abonné elle est le doublon. Ne concerne que les enregistrements créés avant le nettoyage automatique des adresses : la plupart des canaux ne trouveront rien."
        whitespace:
          title: "Supprimer les espaces parasites des données des abonnés"
          description: "Supprime les espaces en début et fin des noms et des valeurs des champs personnalisés. Une valeur précédée d'un espace ne correspondra pas à une règle de segment qui la recherche."
        suppression_promotion:
          title: "Copier les exclusions de ce canal vers la liste globale"
          description: "Une adresse ayant provoqué un rebond ou une plainte dans ce canal reçoit toujours des e-mails lorsque la même personne apparaît dans un autre canal, ce qui nuit à votre réputation d'envoi. Cette tâche copie toutes les adresses de la liste d'exclusion de ce canal vers la liste globale, pour les bloquer partout. La liste propre au canal est conservée, et relancer la tâche n'ajoute rien."
        postmark_server_names:
          title: "Réparer les noms des serveurs Postmark"
          description: "Les versions précédentes envoyaient à Postmark un nom de serveur précédé de « Postmark - », et ajoutaient un nouveau préfixe à chaque nouvelle configuration, si bien que des serveurs se retrouvaient nommés « Postmark - Postmark - Acme ». Cette tâche les renomme dans Postmark pour correspondre au nom affiché ici. Un serveur dont le nom Postmark diffère pour une autre raison a peut-être été renommé volontairement : il est signalé plutôt que modifié. La plupart des installations ne trouveront rien."
