    autopilot_presets:
      tech:
        tone: "Technique et informatif, mais accessible. Utilisez un langage clair pour expliquer les sujets complexes. Incluez des extraits de code ou des détails techniques quand c'est pertinent. Gardez une voix professionnelle mais abordable, appréciée des développeurs."
        content: "Mettez l'accent sur : les nouvelles versions, les changements incompatibles, les mises à jour de sécurité, les gains de performances et les outils pour développeurs. Privilégiez les informations directement utiles. Incluez des liens vers la documentation et les ressources pertinentes."
        structure: "## 🚀 Nouveautés\n\n{new_releases}\n\n## ⚠️ Changements incompatibles\n\n{breaking_changes}\n\n## 🔧 Correctifs et améliorations\n\n{fixes}\n\n## 📚 À lire\n\n{articles}\n\n## 📅 À venir\n\n{upcoming}"
      company:
        tone: "Professionnel, chaleureux et assuré. Exprimez-vous comme un partenaire de confiance qui partage ses nouvelles. Équilibrez information et proximité. Évitez le jargon d'entreprise : soyez humain et authentique."
        content: "Mettez en avant les étapes clés de l'entreprise, les nouveautés produit, les nouvelles de l'équipe et les réussites des clients. Commencez par la nouvelle la plus marquante. Incluez des appels à l'action clairs quand c'est pertinent."
        structure: "## Un mot de l'équipe\n\n{intro}\n\n## Nouveautés produit\n\n{updates}\n\n## Actualités de l'entreprise\n\n{news}\n\n## À l'honneur : nos clients\n\n{spotlight}\n\n## Ce qui arrive\n\n{roadmap}"
      community:
        tone: "Amical, enthousiaste et inclusif. Célébrez les contributions de la communauté et favorisez les liens. Utilisez un langage conversationnel et un peu d'humour à l'occasion. Faites en sorte que les lecteurs se sentent des membres précieux de la communauté."
        content: "Mettez en valeur les contributions de la communauté, soulignez les réussites des membres, partagez les prochains événements et encouragez la participation. Donnez la parole à des voix et des points de vue variés de la communauté."
        structure: "## 👋 Bonjour la communauté !\n\n{greeting}\n\n## 🌟 Les temps forts de la communauté\n\n{highlights}\n\n## 🎉 À l'honneur : nos membres\n\n{spotlight}\n\n## 📆 Prochains événements\n\n{events}\n\n## 💬 La discussion de la semaine\n\n{discussion}\n\n## 🙌 Participez\n\n{cta}"
      changelog:
        tone: "Clair, concis et factuel. Concentrez-vous sur ce qui a changé et pourquoi c'est important pour les utilisateurs. Utilisez des listes à puces pour une lecture rapide. Soyez direct, aussi bien sur les améliorations que sur les problèmes connus."
        content: "Organisez par : nouvelles fonctionnalités, améliorations, correctifs et fonctionnalités obsolètes. Indiquez les numéros de version quand c'est pertinent. Ajoutez des liens vers la documentation détaillée pour les changements complexes."
        structure: "## Version {version} - {date}\n\n### ✨ Nouvelles fonctionnalités\n\n{features}\n\n### 🔄 Améliorations\n\n{improvements}\n\n### 🐛 Correctifs\n\n{fixes}\n\n### ⚠️ Fonctionnalités obsolètes\n\n{deprecations}\n\n### 📝 Remarques\n\n{notes}"
      curated:
        tone: "Réfléchi et engagé, comme un ami averti qui partage ses trouvailles. Ajoutez à chaque lien un commentaire bref mais éclairant. Soyez sélectif : la qualité avant la quantité."
        content: "Sélectionnez les liens les plus intéressants et les plus utiles. Regroupez-les par thème ou par catégorie. Ajoutez un commentaire personnel qui explique pourquoi chaque lien vaut la lecture. Proposez un mélange d'articles, d'outils et de ressources."
        structure: "## La sélection de la semaine\n\n{intro}\n\n### 📖 À ne pas manquer\n\n{must_read}\n\n### 🛠 Outils et ressources\n\n{tools}\n\n### 💡 Idées et inspiration\n\n{ideas}\n\n### 🎯 Liens rapides\n\n{quick_links}\n\n---\n\n*Vous avez trouvé une pépite ? Répondez pour la partager !*"
      industry:
        tone: "Faisant autorité, mais accessible. Apportez de l'analyse et du contexte, pas seulement des nouvelles. Aidez les lecteurs à comprendre pourquoi les évolutions comptent. Équilibrez profondeur et lisibilité."
        content: "Couvrez les principales actualités, tendances et analyses du secteur. Apportez du contexte et des implications. Incluez des avis d'experts et des données quand elles existent. Faites le lien entre les différentes évolutions."
        structure: "## Le pouls du secteur\n\n{summary}\n\n## 📰 À la une\n\n{stories}\n\n## 📊 En chiffres\n\n{data}\n\n## 🔮 Analyses et tendances\n\n{analysis}\n\n## 👀 À surveiller\n\n{watch}\n\n## 💭 Notre avis\n\n{opinion}"
