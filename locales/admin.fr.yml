        address_po_box: "Une boîte postale ou l'adresse d'un domiciliataire convient si vous ne souhaitez pas publier l'adresse de vos bureaux."
        identities_title: "À propos des identités d'expéditeur"
        identities_body_html: "Les identités permettent à un même canal d'envoyer depuis plusieurs adresses (les transactionnels depuis <span class=\"font-medium\">send.votredomaine.fr</span>, les newsletters depuis <span class=\"font-medium\">news.votredomaine.fr</span>) sans diviser votre liste d'abonnés."
        identities_pick: "Chaque campagne, séquence et e-mail transactionnel peut en choisir une ; tout le reste utilise l'identité par défaut."
