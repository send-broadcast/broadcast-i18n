# Broadcast admin interface: field names and validation messages, French.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.fr.yml. bin/check validates the file; see CONTRIBUTING.md.
fr:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Limite de débit (requêtes par minute)"
      admin_api_token:
        rate_limit_per_minute: "Limite de débit (requêtes par minute)"
      topic:
        name: "Nom"
        storage: "Stockage"
        custom_data_key: "Champ personnalisé"
        tag_name: "Tag"
        unset_receives: "Abonnés sans valeur"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "doit être désactivé pour un thème par tag : un tag ne peut pas enregistrer un refus explicite"
            base:
              locked_while_in_use: "Le stockage, le champ personnalisé et le tag ne peuvent pas changer tant que le thème est utilisé, car cela changerait les destinataires. Utilisé par : %{uses}. Retirez-en d'abord le thème."
              in_use_cannot_delete: "Le thème ne peut pas être supprimé tant qu'il est utilisé, car cela changerait les destinataires. Utilisé par : %{uses}. Retirez-en d'abord le thème."
