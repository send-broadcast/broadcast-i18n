          attributes:
            base:
              topic_turned_off_by_subscriber: "L'abonné a désactivé %{topics}. Seul l'abonné peut le réactiver, depuis sa page de préférences."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "doit être un thème de ce canal"
            operator:
              needs_custom_data_topic: "« n'est pas défini » nécessite un thème par champ personnalisé : un thème par tag n'est jamais sans valeur"
  topic_uses:
    broadcast: "campagne « %{name} »"
    sequence: "séquence « %{name} »"
    opt_in_form: "formulaire d'inscription « %{name} »"
    segment: "segment « %{name} »"
    and_more: "et %{count} de plus"
