# Broadcast admin interface: Portuguese (Brazil).
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Brazilian Portuguese, "você". Glossary:
#   broadcast -> campanha           subscriber -> assinante
#   segment -> segmento             sequence -> sequência
#   template -> modelo              opt-in form -> formulário de inscrição
#   transactional email -> e-mail transacional
#   email server -> servidor de e-mail   sender -> remetente
#   sender identity -> identidade de remetente
#   unsubscribe -> cancelar a inscrição / cancelamento
#   bounce -> rejeição              complaint -> reclamação (denúncia de spam)
#   suppression list -> lista de supressão
#   open / click -> abertura / clique   tag -> tag   webhook -> webhook
#   access token -> token de acesso API token -> token de API   channel -> canal
#   draft -> rascunho   schedule -> agendar   send -> enviar
#   test email -> e-mail de teste   Test Server / Test Inbox -> Servidor de teste / Caixa de teste
#   Autopilot -> Piloto automático  file asset -> arquivo
#   dashboard -> painel             settings -> configurações
#   custom field -> campo personalizado   preheader -> texto de pré-visualização
#   brand kit -> kit da marca       endpoint -> endpoint
#   topic -> tópico
