    autopilot_presets:
      tech:
        tone: "Técnico e informativo, mas acessível. Use linguagem clara para explicar temas complexos. Inclua trechos de código ou detalhes técnicos quando for relevante. Mantenha uma voz profissional e próxima, que os desenvolvedores apreciam."
        content: "Foque em: novas versões, mudanças incompatíveis, atualizações de segurança, melhorias de desempenho e ferramentas para desenvolvedores. Priorize informações práticas. Inclua links para a documentação e recursos relevantes."
        structure: "## 🚀 Novidades\n\n{new_releases}\n\n## ⚠️ Mudanças incompatíveis\n\n{breaking_changes}\n\n## 🔧 Correções e melhorias\n\n{fixes}\n\n## 📚 Vale a leitura\n\n{articles}\n\n## 📅 Em breve\n\n{upcoming}"
      company:
        tone: "Profissional, caloroso e confiante. Fale como um parceiro de confiança compartilhando novidades. Equilibre informação e proximidade. Evite jargão corporativo: seja humano e autêntico."
        content: "Destaque marcos da empresa, atualizações de produto, notícias da equipe e casos de sucesso de clientes. Comece pela notícia de maior impacto. Inclua chamadas para ação claras quando fizer sentido."
        structure: "## Olá, da nossa equipe\n\n{intro}\n\n## Atualizações de produto\n\n{updates}\n\n## Notícias da empresa\n\n{news}\n\n## Cliente em destaque\n\n{spotlight}\n\n## O que vem por aí\n\n{roadmap}"
      community:
        tone: "Amigável, entusiasmado e inclusivo. Celebre as contribuições da comunidade e incentive a conexão. Use linguagem de conversa e um pouco de humor de vez em quando. Faça os leitores se sentirem membros valorizados da comunidade."
        content: "Mostre as contribuições da comunidade, destaque conquistas dos membros, divulgue os próximos eventos e incentive a participação. Dê espaço a vozes e perspectivas diversas da comunidade."
        structure: "## 👋 Olá, comunidade!\n\n{greeting}\n\n## 🌟 Destaques da comunidade\n\n{highlights}\n\n## 🎉 Membro em destaque\n\n{spotlight}\n\n## 📆 Próximos eventos\n\n{events}\n\n## 💬 Discussão da semana\n\n{discussion}\n\n## 🙌 Participe\n\n{cta}"
      changelog:
        tone: "Claro, conciso e objetivo. Foque no que mudou e por que isso importa para os usuários. Use tópicos para facilitar a leitura rápida. Seja direto tanto sobre as melhorias quanto sobre os problemas conhecidos."
        content: "Organize em: novos recursos, melhorias, correções de bugs e descontinuações. Inclua os números de versão quando aplicável. Coloque links para a documentação detalhada nas mudanças complexas."
        structure: "## Versão {version} - {date}\n\n### ✨ Novos recursos\n\n{features}\n\n### 🔄 Melhorias\n\n{improvements}\n\n### 🐛 Correções de bugs\n\n{fixes}\n\n### ⚠️ Descontinuações\n\n{deprecations}\n\n### 📝 Observações\n\n{notes}"
      curated:
        tone: "Criterioso e opinativo, como um amigo entendido compartilhando descobertas. Faça comentários breves, mas perspicazes, sobre cada link. Seja seletivo: qualidade acima de quantidade."
        content: "Selecione os links mais interessantes e valiosos. Agrupe por tema ou categoria. Acrescente um comentário pessoal explicando por que vale a pena ler cada link. Inclua uma mistura de artigos, ferramentas e recursos."
        structure: "## Seleção da semana\n\n{intro}\n\n### 📖 Leitura obrigatória\n\n{must_read}\n\n### 🛠 Ferramentas e recursos\n\n{tools}\n\n### 💡 Ideias e inspiração\n\n{ideas}\n\n### 🎯 Links rápidos\n\n{quick_links}\n\n---\n\n*Encontrou algo legal? Responda para compartilhar!*"
      industry:
        tone: "Com autoridade, mas acessível. Traga análise e contexto, não só notícias. Ajude os leitores a entender por que os acontecimentos importam. Equilibre profundidade e facilidade de leitura."
        content: "Cubra as principais notícias, tendências e análises do setor. Traga contexto e implicações. Inclua opiniões de especialistas e dados quando houver. Conecte os pontos entre diferentes acontecimentos."
        structure: "## Pulso do setor\n\n{summary}\n\n## 📰 Principais notícias\n\n{stories}\n\n## 📊 Em números\n\n{data}\n\n## 🔮 Análises e tendências\n\n{analysis}\n\n## 👀 Fique de olho\n\n{watch}\n\n## 💭 Nossa opinião\n\n{opinion}"
