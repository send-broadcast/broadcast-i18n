        needs_hint_title: "Não alterados: a ordem não pode ser determinada"
        needs_hint_body_html: "Estes campos contêm datas como <code>01/02/2026</code>, em que nada nos dados indica se é 1º de fevereiro ou 2 de janeiro, e nenhum outro valor do campo resolve a dúvida. Adivinhar deslocaria cada uma delas em um mês."
        conflicting_title: "Não alterados: dois formatos no mesmo campo"
        conflicting_body: "Estes campos têm datas com o dia primeiro e com o mês primeiro, então nenhuma leitura única serve para todas. A solução é importar de novo a coluna com o formato declarado."
        uncertain_title: "Não alterados: mais de uma resposta possível"
        uncertain_body: "Estes valores não foram alterados porque o valor correto não era certo. Decida cada um você mesmo em vez de deixar o reparo adivinhar."
        collision_title: "Não alterados: colidiriam com outro assinante"
        collision_body: "Organizar estes endereços produziria um endereço que outro assinante já tem. Mesclar dois registros reais é uma decisão à parte, então eles foram ignorados."
        back: "← Voltar à manutenção"
      tasks:
        custom_data_dates:
          title: "Reparar datas em campos personalizados"
          description: "Reescreve as datas guardadas em campos personalizados no formato ISO (2026-01-24) sempre que houver uma única leitura possível: espaços extras, zeros faltando, formatos com o ano primeiro, meses por extenso e valores de dia/mês que provam a própria ordem. As regras de segmento só conseguem comparar datas escritas assim."
        segment_rule_values:
          title: "Reparar datas digitadas em regras de segmento"
          description: "Uma regra que compara com uma data como 24/01/2026 não corresponde a ninguém e não explica o porquê. Isto reescreve esses valores no formato ISO."
        subscriber_emails:
          title: "Organizar os endereços de e-mail dos assinantes"
          description: "Remove espaços soltos e converte os endereços para minúsculas, para que buscas e importações deixem de não encontrá-los. Quando a organização revela o mesmo endereço duas vezes, a cópia desorganizada é desativada para que a pessoa não seja contada (nem receba e-mails) duas vezes; nada é excluído, e o histórico indica de qual assinante ela é duplicata. Só afeta registros gravados antes de os endereços serem organizados automaticamente, então a maioria dos canais não encontrará nada."
        whitespace:
          title: "Remover espaços soltos dos dados dos assinantes"
          description: "Remove os espaços em branco no início e no fim dos nomes e dos valores de campos personalizados. Um valor com um espaço na frente não corresponde a uma regra de segmento que o procura."
        suppression_promotion:
          title: "Copiar as supressões deste canal para a lista global"
          description: "Um endereço que teve rejeição ou reclamação neste canal continua recebendo e-mails quando a mesma pessoa aparece em outro canal, o que custa reputação de envio. Isto copia todos os endereços da lista de supressão deste canal para a lista global, para que fiquem bloqueados em todos os lugares. A lista do próprio canal é mantida, e executar novamente não acrescenta nada."
        postmark_server_names:
          title: "Reparar os nomes dos servidores do Postmark"
          description: "Versões anteriores enviavam ao Postmark o nome do servidor com \"Postmark - \" na frente e acrescentavam outro prefixo a cada nova configuração, então os servidores acabavam com nomes como \"Postmark - Postmark - Acme\". Isto os renomeia no Postmark para corresponder ao nome exibido aqui. Um servidor cujo nome no Postmark seja diferente por qualquer outro motivo pode ter sido renomeado lá de propósito, então ele é relatado em vez de alterado. A maioria das instalações não encontrará nada."
