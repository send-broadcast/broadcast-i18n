# Broadcast admin interface: field names and validation messages, Dutch.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.nl.yml. bin/check validates the file; see CONTRIBUTING.md.
nl:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Snelheidslimiet (verzoeken per minuut)"
      admin_api_token:
        rate_limit_per_minute: "Snelheidslimiet (verzoeken per minuut)"
      topic:
        name: "Naam"
        storage: "Opslag"
        custom_data_key: "Aangepast veld"
        tag_name: "Tag"
        unset_receives: "Abonnees zonder waarde"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "moet uit staan bij een tag-onderwerp: een tag kan geen expliciete afmelding vastleggen"
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "De abonnee heeft %{topics} uitgezet. Alleen de abonnee kan het weer aanzetten, op de eigen voorkeurenpagina."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "moet een onderwerp van dit kanaal zijn"
            operator:
              needs_custom_data_topic: "\"is niet ingesteld\" vereist een onderwerp met een aangepast veld: een tag-onderwerp is nooit zonder waarde"
