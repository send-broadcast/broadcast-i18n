# Broadcast plugins: plugin screens, permissions and emails, Finnish.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.fi.yml. bin/check validates the
# file; see CONTRIBUTING.md.
fi:
  plugins:
    open_link:
      title: "Avataanko tämä linkki?"
      body: "%{plugin} haluaa avata sivun Broadcastin ulkopuolella. Tarkista osoite ennen kuin jatkat."
      open: "Avaa linkki"
    editor_insert:
      close: "Sulje"
      from: "Lisäosasta %{plugin}"
      cleaned: "Broadcast tarkistaa ja puhdistaa HTML:n ennen kuin se lisätään sähköpostiin."
      group: "Lisäosista"
      menu: "Lisää lisäosasta"
    public_action:
      confirm_title: "Hetki vain"
      confirm_button: "Jatka"
      done_title: "Kiitos"
      failed_title: "Jokin meni vikaan"
      failed_body: "Emme voineet tallentaa tätä. Kokeile linkkiä myöhemmin uudelleen."
      test_title: "Tämä on testisähköposti"
      test_body: "Linkki toimii. Oikeassa sähköpostissa tämä napsautus tallennetaan napsauttajalle. Nyt mitään ei tallennettu."
    developer_token:
      label: "Plugin-kehittäjä"
      hint: "Plugineja kirjoittavalle tekoälyagentille: se voi luoda, muuttaa ja testata luonnoksia testidatalla ja lähettää ne sinulle tarkistettaviksi. Se ei voi lukea oikeita tilaajatietoja eikä ottaa mitään käyttöön. Sillä ei voi olla muita käyttöoikeuksia, ja se vanhenee 30 päivän kuluessa."
    webhook_endpoints:
      title: "Pluginien tapahtumat"
      hint: "Lähetetään vain tapahtumista, jotka valitset tässä. Valitse kaikki ei sisällä niitä."
      not_available: "sisältää pluginin tapahtuman, joka ei ole saatavilla tällä kanavalla"
    token_endpoints:
      label: "Pluginien päätepisteet"
      hint: "Pluginien API-päätepisteet, joita tämä tunnus saa kutsua, yksi riviä kohden (plugin/päätepiste tai plugin/* kaikille). Tunnus tarvitsee myös käyttöoikeuden, jota kukin päätepiste vaatii."
      needs: "vaatii: %{permission}"
    permissions:
      settings:
        label: "Omat asetukset"
        description: "Lukee asetukset, jotka annat tälle pluginille, myös salaiset arvot."
      store:
        label: "Oma tallennustila"
        description: "Säilyttää omia tietojaan Broadcastissa."
      log:
        label: "Lokit"
        description: "Kirjoittaa lokirivejä, joita voit lukea pluginin sivulla."
      channel:
        label: "Kanavan nimi"
        description: "Lukee sen kanavan nimen, jossa se toimii."
      events:
        label: "Omat tapahtumat"
        description: "Tallentaa tapahtumia (esimerkiksi tilauksia) omia segmenttisääntöjään varten."
      subscribers_read:
        label: "Tilaajien lukeminen"
        description: "Lukee tilaajien tiedot, tunnisteet ja mukautetut kentät."
      subscribers_write:
        label: "Tilaajien muuttaminen"
        description: "Muuttaa olemassa olevien tilaajien nimiä, mukautettuja kenttiä ja muita tietoja."
      tags_read:
        label: "Tunnisteiden lukeminen"
        description: "Lukee tunnisteluettelon."
      tags_write:
        label: "Tunnisteiden muuttaminen"
        description: "Lisää tilaajille tunnisteita ja poistaa niitä."
      broadcasts_read:
        label: "Kampanjoiden lukeminen"
        description: "Lukee kampanjat ja niiden tilastot."
      sequences_read:
        label: "Sarjojen lukeminen"
        description: "Lukee sarjat ja niiden vaiheet."
      segments_read:
        label: "Segmenttien lukeminen"
        description: "Lukee segmentit ja niiden säännöt."
      network:
        label: "Internetyhteys"
        description: "Muodostaa yhteyden näihin sivustoihin: %{hosts}."
      subscribers_export:
        label: "Koko listasi kopioiminen"
        description: "Voi lukea jokaisen tilaajan sivu kerrallaan ja lähettää heidät kohteeseen %{hosts}."
      subscribers_create:
        label: "Uusien tilaajien lisääminen"
        description: "Lisää henkilöitä listallesi. Kaksoisvahvistusasetuksesi (double opt-in) on voimassa."
      network_wildcard:
        label: "Internetyhteys moniin sivustoihin"
        description: "Muodostaa yhteyden mihin tahansa sivustoon, joka vastaa kohdetta %{hosts}."
      network_fromSetting:
        label: "Internetyhteys antamaasi osoitteeseen"
        description: "Muodostaa yhteyden osoitteeseen, jonka kirjoitat asetukseen %{setting}."
      output_html:
        label: "HTML sähköposteissa"
        description: "Lisää sähköposteihin HTML:ää. Broadcast siivoaa sen ennen lähetystä."
      hooks_beforeSend:
        label: "Sähköpostien muuttaminen ennen lähetystä"
        description: "Voi ohittaa sähköpostin tai muuttaa sen aihetta ja sisältöä. Se ei voi muuttaa vastaanottajaa, lähettäjää eikä tilauksen peruutuslinkkiä."
      hooks_apiEndpoints:
        label: "Oma API"
        description: "Lisää API-osoitteita, joita voivat käyttää kutsujat, joilla on vastaava API-tunnus."
      events_webhook:
        label: "Omat tapahtumat webhookeissa"
        description: "Voit lähettää tämän pluginin tapahtumia webhook-päätepisteisiisi. Mitään ei lähetetä, ennen kuin kytket tapahtuman päälle päätepisteelle. Webhook sisältää tapahtuman, sen ilmoitetut kentät ja tilaajan tunnisteen, ei koskaan sähköpostiosoitetta."
      hooks_publicActions:
        label: "Sähköpostien linkit, joita kuka tahansa voi klikata"
        description: "Lisää sähköposteihin linkkejä, jotka suorittavat tämän pluginin, kun tilaaja klikkaa niitä, ilman kirjautumista. Broadcast todentaa, kuka klikkasi. Plugin saa tilaajan ja linkissä olevan valinnan."
      network_private:
        label: "Yhteys yhteen yksityiseen osoitteeseen"
        description: "Muodostaa yhteyden yhteen yksityisen verkkosi osoitteeseen, jonka hyväksyt."
      email_sender:
        label: "Lähettäjän muuttaminen"
        description: "Muuttaa Lähettäjä- tai Vastausosoite-kentän lähettäjäksi, joka on vahvistettu tällä kanavalla."
      sql:
        label: "Tietokannan käyttö"
      files:
        label: "Tiedostojen käyttö"
      env:
        label: "Palvelinasetusten käyttö"
      process:
        label: "Ohjelmien käynnistäminen"
      subscribers_resubscribe:
        label: "Henkilöiden tilaaminen uudelleen"
      suppressions_write:
        label: "Estojen poistaminen"
      email_recipients:
        label: "Sähköpostien vastaanottajien muuttaminen"
      email_unsubscribe:
        label: "Tilauksen peruutuslinkin muuttaminen"
