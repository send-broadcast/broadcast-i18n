# Broadcast admin interface: field names and validation messages, Norwegian Bokmål.
#
# Every key mirrors reference/activerecord.en.yml. Keep each %{placeholder} as
# it is and never use long dashes. Follow the style notes and glossary at the top
# of admin.nb.yml. bin/check validates the file; see CONTRIBUTING.md.
nb:
  activerecord:
    attributes:
      token:
        rate_limit_per_minute: "Hastighetsgrense (forespørsler per minutt)"
      admin_api_token:
        rate_limit_per_minute: "Hastighetsgrense (forespørsler per minutt)"
      topic:
        name: "Navn"
        storage: "Lagring"
        custom_data_key: "Egendefinert felt"
        tag_name: "Tagg"
        unset_receives: "Abonnenter uten verdi"
    errors:
      models:
        topic:
          attributes:
            unset_receives:
              not_allowed_for_tag: "må være av for et taggemne: en tagg kan ikke registrere et uttrykkelig nei"
            base:
              locked_while_in_use: "Lagring, egendefinert felt og tagg kan ikke endres mens emnet er i bruk, fordi det ville endre hvem som mottar e-post. I bruk av: %{uses}. Fjern emnet derfra først."
              in_use_cannot_delete: "Emnet kan ikke slettes mens det er i bruk, fordi det ville endre hvem som mottar e-post. I bruk av: %{uses}. Fjern emnet derfra først."
              kept_by_archived_broadcasts: "Emnet kan ikke slettes mens en arkivert kampanje som ikke er sendt, bruker det, fordi kampanjen ville bli sendt til alle mottakerne sine hvis den hentes fra arkivet. Arkivert: %{uses}. Slett kampanjen eller fjern emnet fra den først."
        subscriber:
          attributes:
            base:
              topic_turned_off_by_subscriber: "Abonnenten har slått av %{topics}. Bare abonnenten kan slå det på igjen, på sin innstillingsside."
        segment_rule:
          attributes:
            value:
              topic_not_in_channel: "må være et emne i denne kanalen"
            operator:
              needs_custom_data_topic: "«er ikke angitt» krever et emne med egendefinert felt: et taggemne er aldri uten verdi"
  topic_uses:
    broadcast: "kampanje «%{name}»"
    sequence: "sekvens «%{name}»"
    opt_in_form: "påmeldingsskjema «%{name}»"
    segment: "segment «%{name}»"
    and_more: "og %{count} til"
