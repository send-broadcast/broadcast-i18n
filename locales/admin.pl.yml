        conflicting_title: "Bez zmian: dwa formaty w jednym polu"
        conflicting_body: "Te pola zawierają daty zapisane zarówno w kolejności dzień-miesiąc, jak i miesiąc-dzień, więc żadna pojedyncza interpretacja nie pasuje do wszystkich. Rozwiązaniem jest ponowny import kolumny z zadeklarowanym formatem."
