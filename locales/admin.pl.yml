        content: "Prezentuj wkład społeczności, wyróżniaj osiągnięcia członków, zapowiadaj nadchodzące wydarzenia i zachęcaj do udziału. Dawaj głos różnym osobom i perspektywom ze społeczności."
        structure: "## 👋 Cześć, społeczności!\n\n{greeting}\n\n## 🌟 Wyróżnienia społeczności\n\n{highlights}\n\n## 🎉 Członek w centrum uwagi\n\n{spotlight}\n\n## 📆 Nadchodzące wydarzenia\n\n{events}\n\n## 💬 Dyskusja tygodnia\n\n{discussion}\n\n## 🙌 Dołącz\n\n{cta}"
      changelog:
        tone: "Jasny, zwięzły i rzeczowy. Skup się na tym, co się zmieniło i dlaczego ma to znaczenie dla użytkowników. Używaj wypunktowań dla łatwego przeglądania. Mów wprost zarówno o ulepszeniach, jak i o znanych problemach."
        content: "Porządkuj według kategorii: nowe funkcje, ulepszenia, poprawki błędów i wycofywane elementy. Tam, gdzie to możliwe, podawaj numery wersji. Przy złożonych zmianach dodawaj linki do szczegółowej dokumentacji."
        structure: "## Wersja {version} - {date}\n\n### ✨ Nowe funkcje\n\n{features}\n\n### 🔄 Ulepszenia\n\n{improvements}\n\n### 🐛 Poprawki błędów\n\n{fixes}\n\n### ⚠️ Wycofywane elementy\n\n{deprecations}\n\n### 📝 Uwagi\n\n{notes}"
      curated:
        tone: "Przemyślany i wyrazisty, jak znający się na rzeczy przyjaciel, który dzieli się znaleziskami. Do każdego linku dodawaj krótki, ale trafny komentarz. Bądź wybiórczy: jakość ponad ilość."
        content: "Wybieraj najciekawsze i najbardziej wartościowe linki. Grupuj je według tematu lub kategorii. Dodawaj osobisty komentarz wyjaśniający, dlaczego warto przeczytać każdy link. Łącz artykuły, narzędzia i materiały."
        structure: "## Wybór tygodnia\n\n{intro}\n\n### 📖 Koniecznie przeczytaj\n\n{must_read}\n\n### 🛠 Narzędzia i materiały\n\n{tools}\n\n### 💡 Pomysły i inspiracje\n\n{ideas}\n\n### 🎯 Szybkie linki\n\n{quick_links}\n\n---\n\n*Znalazłeś coś świetnego? Odpowiedz i podziel się tym!*"
      industry:
        tone: "Wiarygodny, ale przystępny. Dawaj analizę i kontekst, a nie tylko wiadomości. Pomagaj czytelnikom zrozumieć, dlaczego dane wydarzenia są ważne. Łącz głębię z czytelnością."
        content: "Omawiaj najważniejsze wiadomości, trendy i analizy z branży. Dawaj kontekst i opisuj konsekwencje. Gdy to możliwe, uwzględniaj opinie ekspertów i dane. Łącz fakty z różnych wydarzeń."
        structure: "## Puls branży\n\n{summary}\n\n## 📰 Najważniejsze wiadomości\n\n{stories}\n\n## 📊 W liczbach\n\n{data}\n\n## 🔮 Analizy i trendy\n\n{analysis}\n\n## 👀 Warto obserwować\n\n{watch}\n\n## 💭 Nasze zdanie\n\n{opinion}"
