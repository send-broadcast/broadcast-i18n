        uncertain_body: "Te wartości nie zostały zmienione, ponieważ poprawna wartość nie była pewna. Zdecyduj o każdej z nich samodzielnie, zamiast pozwalać naprawie zgadywać."
        collision_title: "Bez zmian: kolizja z innym subskrybentem"
        collision_body: "Uporządkowanie tych adresów dałoby adres, który ma już inny subskrybent. Scalanie dwóch prawdziwych rekordów to osobna decyzja, więc je pominięto."
