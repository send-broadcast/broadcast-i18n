      tasks:
        custom_data_dates:
          title: "Napraw daty w polach niestandardowych"
          description: "Zapisuje daty z pól niestandardowych w formacie ISO (2026-01-24), gdy możliwa jest tylko jedna interpretacja: dodatkowe spacje, brakujące zera, formaty z rokiem na początku, nazwy miesięcy oraz wartości dzień/miesiąc, które same wskazują kolejność. Reguły segmentów potrafią porównywać tylko daty zapisane w ten sposób."
        segment_rule_values:
          title: "Napraw daty wpisane w regułach segmentów"
          description: "Reguła porównująca z datą taką jak 24/01/2026 nie pasuje do nikogo i nie wyjaśnia dlaczego. To zadanie zapisuje takie wartości w formacie ISO."
        subscriber_emails:
          title: "Uporządkuj adresy e-mail subskrybentów"
          description: "Usuwa zbędne spacje i zmienia litery na małe, aby wyszukiwanie i importy przestały pomijać te adresy. Jeśli po uporządkowaniu ten sam adres pojawi się dwa razy, nieuporządkowana kopia zostanie dezaktywowana, aby osoba nie była liczona (ani nie otrzymywała e-maili) podwójnie; nic nie jest usuwane, a w historii widać, którego subskrybenta duplikuje. Dotyczy tylko rekordów zapisanych, zanim adresy zaczęto porządkować automatycznie, więc w większości kanałów nic nie zostanie znalezione."
        whitespace:
          title: "Usuń zbędne spacje z danych subskrybentów"
          description: "Usuwa białe znaki z początku i końca imion i wartości pól niestandardowych. Wartość poprzedzona spacją nie zostanie dopasowana przez regułę segmentu, która jej szuka."
        suppression_promotion:
          title: "Kopiuj wykluczenia tego kanału na listę globalną"
          description: "Adres, który w tym kanale miał odbicie lub skargę, nadal otrzymuje pocztę, gdy ta sama osoba pojawi się w innym kanale, co szkodzi reputacji nadawcy. To zadanie kopiuje każdy adres z listy wykluczeń tego kanału na listę globalną, więc jest on blokowany wszędzie. Lista kanału pozostaje bez zmian, a ponowne uruchomienie niczego nie doda."
        postmark_server_names:
          title: "Napraw nazwy serwerów Postmark"
          description: "Wcześniejsze wersje wysyłały do Postmark nazwę serwera z prefiksem „Postmark - ” i dodawały kolejny prefiks przy każdej ponownej konfiguracji, przez co serwery miały nazwy w rodzaju „Postmark - Postmark - Acme”. To zadanie zmienia ich nazwy w Postmark na zgodne z nazwą wyświetlaną tutaj. Serwer, którego nazwa w Postmark różni się z jakiegokolwiek innego powodu, mógł zostać tam celowo przemianowany, więc jest tylko raportowany. W większości instalacji nic nie zostanie znalezione."
