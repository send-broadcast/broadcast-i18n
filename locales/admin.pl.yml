# Broadcast admin interface: Polish.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal second person singular in instructions ("Kliknij", "Wybierz"), neutral tone.
# Plurals need one/few/many/other (1 kampania, 2 kampanie, 5 kampanii, 1,5 kampanii).
# Glossary:
#   broadcast -> kampania           subscriber -> subskrybent
#   segment -> segment              sequence -> sekwencja
#   template -> szablon             opt-in form -> formularz zapisu
#   transactional email -> e-mail transakcyjny
#   email server -> serwer poczty   sender -> nadawca
#   sender identity -> tożsamość nadawcy
#   unsubscribe -> wypisać się / wypisanie
#   bounce -> odbicie               complaint -> skarga (zgłoszenie spamu)
#   suppression list -> lista wykluczeń
#   open / click -> otwarcie / kliknięcie   tag -> tag   webhook -> webhook
#   access token -> token dostępu   API token -> token API   channel -> kanał
#   draft -> wersja robocza   schedule -> zaplanować   send -> wysłać
#   test email -> testowy e-mail    Test Server / Test Inbox -> Serwer testowy / Skrzynka testowa
#   Autopilot -> Autopilot          file asset -> plik
#   dashboard -> pulpit             settings -> ustawienia
#   custom field -> pole niestandardowe   preheader -> tekst podglądu
#   brand kit -> zestaw marki       endpoint -> endpoint
#   topic -> temat
