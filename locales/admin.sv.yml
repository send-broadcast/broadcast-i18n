# Broadcast admin interface: Swedish.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal "du". Glossary:
#   broadcast -> kampanj            subscriber -> prenumerant
#   segment -> segment              sequence -> sekvens
#   template -> mall                opt-in form -> registreringsformulär
#   transactional email -> transaktionsmejl   email -> e-post / mejl
#   email server -> e-postserver    sender -> avsändare
#   sender identity -> avsändaridentitet
#   unsubscribe -> avregistrera / avregistrering
#   bounce -> studs                 complaint -> klagomål (spamanmälan)
#   suppression list -> spärrlista
#   open / click -> öppning / klick tag -> tagg   webhook -> webhook
#   access token -> åtkomsttoken    API token -> API-token   channel -> kanal
#   draft -> utkast   schedule -> schemalägga   send -> skicka
#   test email -> testmejl          Test Server / Test Inbox -> Testserver / Testinkorg
#   Autopilot -> Autopilot          file asset -> fil
#   dashboard -> översikt           settings -> inställningar
#   custom field -> anpassat fält   preheader -> förhandsvisningstext
#   brand kit -> varumärkeskit      endpoint -> endpoint
#   topic -> ämne
