    autopilot_presets:
      tech:
        tone: "Tekniskt och informativt, men tillgängligt. Använd ett tydligt språk för att förklara komplexa ämnen. Ta med kodexempel eller tekniska detaljer där det är relevant. Håll en professionell men lättillgänglig ton som utvecklare uppskattar."
        content: "Fokusera på: nya versioner, bakåtinkompatibla ändringar, säkerhetsuppdateringar, prestandaförbättringar och utvecklarverktyg. Prioritera information som går att agera på. Ta med länkar till dokumentation och relevanta resurser."
        structure: "## 🚀 Nyheter\n\n{new_releases}\n\n## ⚠️ Bakåtinkompatibla ändringar\n\n{breaking_changes}\n\n## 🔧 Buggfixar och förbättringar\n\n{fixes}\n\n## 📚 Värt att läsa\n\n{articles}\n\n## 📅 På gång\n\n{upcoming}"
      company:
        tone: "Professionellt, varmt och självsäkert. Tala som en betrodd partner som delar nyheter. Balansera det informativa med det personliga. Undvik företagsjargong, var mänsklig och äkta."
        content: "Lyft fram företagets milstolpar, produktuppdateringar, nyheter om teamet och kundframgångar. Börja med de viktigaste nyheterna. Ta med tydliga uppmaningar till handling där det passar."
        structure: "## Hej från teamet\n\n{intro}\n\n## Produktuppdateringar\n\n{updates}\n\n## Företagsnyheter\n\n{news}\n\n## Kund i fokus\n\n{spotlight}\n\n## Det här kommer härnäst\n\n{roadmap}"
      community:
        tone: "Vänligt, entusiastiskt och inkluderande. Fira bidrag från communityn och skapa gemenskap. Använd ett samtalsmässigt språk och lite humor ibland. Få läsarna att känna sig som värdefulla medlemmar i communityn."
        content: "Visa upp bidrag från communityn, lyft fram medlemmarnas prestationer, berätta om kommande evenemang och uppmuntra till deltagande. Ge plats åt olika röster och perspektiv från communityn."
        structure: "## 👋 Hej allihopa!\n\n{greeting}\n\n## 🌟 Höjdpunkter från communityn\n\n{highlights}\n\n## 🎉 Medlem i fokus\n\n{spotlight}\n\n## 📆 Kommande evenemang\n\n{events}\n\n## 💬 Veckans diskussion\n\n{discussion}\n\n## 🙌 Engagera dig\n\n{cta}"
      changelog:
        tone: "Tydligt, kortfattat och sakligt. Fokusera på vad som har ändrats och varför det spelar roll för användarna. Använd punktlistor så att det är lätt att skumma. Var rak om både förbättringar och kända problem."
        content: "Organisera efter: nya funktioner, förbättringar, buggfixar och utfasningar. Ta med versionsnummer där det är tillämpligt. Länka till detaljerad dokumentation för komplexa ändringar."
        structure: "## Version {version}, {date}\n\n### ✨ Nya funktioner\n\n{features}\n\n### 🔄 Förbättringar\n\n{improvements}\n\n### 🐛 Buggfixar\n\n{fixes}\n\n### ⚠️ Utfasningar\n\n{deprecations}\n\n### 📝 Anteckningar\n\n{notes}"
      curated:
        tone: "Eftertänksamt och med egna åsikter, som en kunnig vän som delar med sig av fynd. Ge en kort men insiktsfull kommentar till varje länk. Var selektiv: kvalitet före kvantitet."
        content: "Välj ut de mest intressanta och värdefulla länkarna. Gruppera efter tema eller kategori. Lägg till personliga kommentarer som förklarar varför varje länk är värd att läsa. Ta med en blandning av artiklar, verktyg och resurser."
        structure: "## Veckans val\n\n{intro}\n\n### 📖 Måste läsas\n\n{must_read}\n\n### 🛠 Verktyg och resurser\n\n{tools}\n\n### 💡 Idéer och inspiration\n\n{ideas}\n\n### 🎯 Snabblänkar\n\n{quick_links}\n\n---\n\n*Hittat något bra? Svara och dela det!*"
      industry:
        tone: "Auktoritativt men tillgängligt. Ge analys och sammanhang, inte bara nyheter. Hjälp läsarna att förstå varför utvecklingen spelar roll. Balansera djup med läsbarhet."
        content: "Bevaka stora branschnyheter, trender och analyser. Ge sammanhang och konsekvenser. Ta med expertutlåtanden och data där det finns. Koppla ihop olika händelser med varandra."
        structure: "## Branschpulsen\n\n{summary}\n\n## 📰 Toppnyheter\n\n{stories}\n\n## 📊 I siffror\n\n{data}\n\n## 🔮 Analys och trender\n\n{analysis}\n\n## 👀 Att hålla koll på\n\n{watch}\n\n## 💭 Vår syn\n\n{opinion}"
