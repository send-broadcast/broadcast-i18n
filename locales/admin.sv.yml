        needs_hint_title: "Lämnas orörda: ordningen går inte att veta"
        needs_hint_body_html: "Dessa fält innehåller datum som <code>01/02/2026</code>, där inget i datan säger om det är 1 februari eller 2 januari, och inget annat värde i fältet avgör saken. En gissning skulle flytta varenda en av dem med en månad."
        conflicting_title: "Lämnas orörda: två format i samma fält"
        conflicting_body: "Dessa fält innehåller både datum med dagen först och datum med månaden först, så ingen enskild tolkning stämmer för alla. Lösningen är att importera kolumnen igen med formatet angivet."
        uncertain_title: "Lämnas orörda: mer än ett möjligt svar"
        uncertain_body: "Dessa ändrades inte eftersom rätt värde inte var säkert. Bestäm vart och ett själv i stället för att låta reparationen gissa."
        collision_title: "Lämnas orörda: skulle krocka med en annan prenumerant"
        collision_body: "Att städa dessa adresser skulle ge en adress som en annan prenumerant redan har. Att slå ihop två verkliga poster är ett separat beslut, så de hoppades över."
        back: "← Tillbaka till Underhåll"
      tasks:
        custom_data_dates:
          title: "Reparera datum i anpassade fält"
          description: "Skriver om datum i anpassade fält till ISO-format (2026-01-24) där det bara finns en möjlig tolkning: extra mellanslag, saknade nollor, format med året först, utskrivna månadsnamn och dag/månad-värden som visar sin egen ordning. Segmentregler kan bara jämföra datum som skrivs på detta sätt."
        segment_rule_values:
          title: "Reparera datum som skrivits in i segmentregler"
          description: "En regel som jämför mot ett datum som 24/01/2026 matchar ingen och säger inget om varför. Detta skriver om sådana värden till ISO-format."
        subscriber_emails:
          title: "Städa prenumeranters e-postadresser"
          description: "Tar bort lösa mellanslag och gör adresserna gemena så att sökningar och importer inte missar dem. Om städningen visar att samma adress finns två gånger inaktiveras den ostädade kopian så att personen inte räknas (eller mejlas) två gånger; inget tas bort, och dess historik visar vilken prenumerant den är en dubblett av. Påverkar bara poster som skrevs innan adresser städades automatiskt, så de flesta kanaler hittar inget."
        whitespace:
          title: "Ta bort lösa mellanslag i prenumerantdata"
          description: "Tar bort inledande och avslutande blanksteg från namn och värden i anpassade fält. Ett värde med ett mellanslag framför matchar inte en segmentregel som letar efter det."
        suppression_promotion:
          title: "Kopiera kanalens spärrar till den globala listan"
          description: "En adress som studsat eller klagat i denna kanal mejlas ändå när samma person finns i en annan kanal, vilket kostar avsändarrykte. Detta kopierar alla adresser i kanalens spärrlista till den globala listan, så att de blockeras överallt. Kanalens egen lista behålls, och om du kör detta igen läggs inget till."
        postmark_server_names:
          title: "Reparera servernamn i Postmark"
          description: "Tidigare versioner skickade ett servernamn till Postmark med \"Postmark - \" framför och lade till ytterligare ett prefix varje gång konfigurationen kördes igen, så att servrar fick namn som \"Postmark - Postmark - Acme\". Detta byter namn på dem i Postmark så att de matchar namnet som visas här. En server vars namn i Postmark skiljer sig av någon annan anledning kan ha bytt namn där med avsikt, så den rapporteras i stället för att ändras. De flesta installationer hittar inget."
