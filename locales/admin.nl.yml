# Broadcast admin interface: Dutch.
#
# Every key mirrors reference/admin.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes.
# bin/check validates the file; see CONTRIBUTING.md.
#
# Informal "je/jouw" (as in modern Dutch software), never "u". Compounds written as one
# word or with a hyphen after an abbreviation ("e-mailadres", "API-sleutel").
# Glossary:
#   broadcast -> campagne           subscriber -> abonnee (abonnees)
#   segment -> segment              sequence -> reeks
#   template -> sjabloon            opt-in form -> aanmeldformulier
#   transactional email -> transactionele e-mail
#   email server -> e-mailserver    sender -> afzender
#   sender identity -> afzenderidentiteit
#   unsubscribe -> afmelden / afmelding
#   bounce -> bounce                complaint -> klacht (spammelding)
#   suppression list -> blokkeerlijst
#   open / click -> opening / klik  tag -> tag   webhook -> webhook
#   access token -> toegangstoken   API token -> API-token   channel -> kanaal
#   draft -> concept   schedule -> inplannen   send -> verzenden
#   test email -> testmail          Test Server / Test Inbox -> Testserver / Testinbox
#   Autopilot -> Autopilot          file asset -> bestand
#   dashboard -> dashboard          settings -> instellingen
#   custom field -> aangepast veld  preheader -> voorbeeldtekst
#   brand kit -> huisstijlkit       endpoint -> endpoint
#   topic -> onderwerp
