      tasks:
        custom_data_dates:
          title: "Datums in aangepaste velden herstellen"
          description: "Herschrijft datums in aangepaste velden naar ISO (2026-01-24) wanneer er maar één lezing mogelijk is: extra spaties, ontbrekende nullen, notaties met het jaar eerst, maandnamen en dag/maand-waarden waarvan de volgorde vaststaat. Segmentregels kunnen alleen datums in deze notatie vergelijken."
        segment_rule_values:
          title: "Datums in segmentregels herstellen"
          description: "Een regel die vergelijkt met een datum zoals 24/01/2026, komt met niemand overeen en zegt niet waarom. Deze taak herschrijft die waarden naar ISO."
        subscriber_emails:
          title: "E-mailadressen van abonnees opschonen"
          description: "Verwijdert overbodige spaties en zet adressen in kleine letters, zodat zoekopdrachten en imports ze niet meer missen. Als na het opschonen hetzelfde adres twee keer voorkomt, wordt de niet-opgeschoonde kopie gedeactiveerd, zodat de persoon niet dubbel wordt geteld (of gemaild); er wordt niets verwijderd, en de geschiedenis vermeldt van welke abonnee het een dubbele is. Geldt alleen voor gegevens van vóór het automatisch opschonen van adressen, dus de meeste kanalen vinden niets."
        whitespace:
          title: "Overbodige spaties uit abonneegegevens verwijderen"
          description: "Verwijdert spaties aan het begin en eind van namen en waarden in aangepaste velden. Een waarde met een spatie ervoor komt niet overeen met een segmentregel die ernaar zoekt."
        suppression_promotion:
          title: "Blokkeringen van dit kanaal naar de globale lijst kopiëren"
          description: "Een adres dat in dit kanaal een bounce of klacht gaf, wordt nog gemaild als dezelfde persoon in een ander kanaal voorkomt, en dat kost verzendreputatie. Deze taak kopieert alle adressen op de blokkeerlijst van dit kanaal naar de globale lijst, zodat ze overal worden geblokkeerd. De eigen lijst van het kanaal blijft bewaard, en opnieuw uitvoeren voegt niets toe."
        postmark_server_names:
          title: "Namen van Postmark-servers herstellen"
          description: "Eerdere versies stuurden Postmark een servernaam met \"Postmark - \" ervoor, en voegden bij elke nieuwe installatie nog een voorvoegsel toe, zodat servers uiteindelijk \"Postmark - Postmark - Acme\" heetten. Deze taak hernoemt ze in Postmark naar de naam die hier wordt getoond. Een server waarvan de naam in Postmark om een andere reden afwijkt, is daar mogelijk bewust hernoemd; die wordt gemeld in plaats van gewijzigd. De meeste installaties vinden niets."
