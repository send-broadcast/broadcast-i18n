    autopilot_presets:
      tech:
        tone: "Technisch en informatief, maar toegankelijk. Gebruik heldere taal om complexe onderwerpen uit te leggen. Voeg waar relevant codefragmenten of technische details toe. Houd een professionele maar benaderbare stem aan die ontwikkelaars waarderen."
        content: "Richt je op: nieuwe releases, ingrijpende wijzigingen, beveiligingsupdates, prestatieverbeteringen en ontwikkelaarstools. Geef voorrang aan praktische informatie. Voeg links naar documentatie en relevante bronnen toe."
        structure: "## 🚀 Wat is er nieuw\n\n{new_releases}\n\n## ⚠️ Ingrijpende wijzigingen\n\n{breaking_changes}\n\n## 🔧 Bugfixes en verbeteringen\n\n{fixes}\n\n## 📚 Het lezen waard\n\n{articles}\n\n## 📅 Binnenkort\n\n{upcoming}"
      company:
        tone: "Professioneel, warm en zelfverzekerd. Spreek als een vertrouwde partner die updates deelt. Breng informatief en persoonlijk in balans. Vermijd bedrijfsjargon, wees menselijk en authentiek."
        content: "Belicht mijlpalen van het bedrijf, productupdates, teamnieuws en succesverhalen van klanten. Begin met het belangrijkste nieuws. Voeg waar passend duidelijke calls-to-action toe."
        structure: "## Hallo van het team\n\n{intro}\n\n## Productupdates\n\n{updates}\n\n## Bedrijfsnieuws\n\n{news}\n\n## Klant in de schijnwerpers\n\n{spotlight}\n\n## Wat er hierna komt\n\n{roadmap}"
      community:
        tone: "Vriendelijk, enthousiast en inclusief. Vier bijdragen uit de community en stimuleer verbinding. Gebruik informele taal en af en toe humor. Laat lezers voelen dat ze gewaardeerde leden van de community zijn."
        content: "Laat bijdragen uit de community zien, belicht prestaties van leden, deel komende evenementen en moedig deelname aan. Geef ruimte aan diverse stemmen en perspectieven uit de community."
        structure: "## 👋 Hallo community!\n\n{greeting}\n\n## 🌟 Hoogtepunten uit de community\n\n{highlights}\n\n## 🎉 Lid in de schijnwerpers\n\n{spotlight}\n\n## 📆 Komende evenementen\n\n{events}\n\n## 💬 Discussie van de week\n\n{discussion}\n\n## 🙌 Doe mee\n\n{cta}"
      changelog:
        tone: "Duidelijk, beknopt en feitelijk. Richt je op wat er veranderd is en waarom dat voor gebruikers belangrijk is. Gebruik opsommingstekens zodat alles makkelijk te scannen is. Wees direct over zowel verbeteringen als bekende problemen."
        content: "Orden op: nieuwe functies, verbeteringen, bugfixes en uitfaseringen. Vermeld waar van toepassing versienummers. Link naar uitgebreide documentatie bij complexe wijzigingen."
        structure: "## Versie {version} ({date})\n\n### ✨ Nieuwe functies\n\n{features}\n\n### 🔄 Verbeteringen\n\n{improvements}\n\n### 🐛 Bugfixes\n\n{fixes}\n\n### ⚠️ Uitfaseringen\n\n{deprecations}\n\n### 📝 Opmerkingen\n\n{notes}"
      curated:
        tone: "Doordacht en uitgesproken, als een deskundige vriend die vondsten deelt. Geef bij elke link kort maar scherp commentaar. Wees selectief: kwaliteit boven kwantiteit."
        content: "Selecteer de interessantste en waardevolste links. Groepeer ze per thema of categorie. Voeg persoonlijk commentaar toe waarom elke link het lezen waard is. Neem een mix op van artikelen, tools en bronnen."
        structure: "## De keuzes van deze week\n\n{intro}\n\n### 📖 Must-read\n\n{must_read}\n\n### 🛠 Tools en bronnen\n\n{tools}\n\n### 💡 Ideeën en inspiratie\n\n{ideas}\n\n### 🎯 Snelle links\n\n{quick_links}\n\n---\n\n*Iets moois gevonden? Reageer om het te delen!*"
      industry:
        tone: "Gezaghebbend maar toegankelijk. Geef analyse en context, niet alleen nieuws. Help lezers begrijpen waarom ontwikkelingen ertoe doen. Breng diepgang en leesbaarheid in balans."
        content: "Behandel belangrijk branchenieuws, trends en analyses. Geef context en gevolgen. Neem waar mogelijk meningen van experts en data op. Leg verbanden tussen verschillende ontwikkelingen."
        structure: "## Hartslag van de branche\n\n{summary}\n\n## 📰 Belangrijkste verhalen\n\n{stories}\n\n## 📊 In cijfers\n\n{data}\n\n## 🔮 Analyse en trends\n\n{analysis}\n\n## 👀 Om in de gaten te houden\n\n{watch}\n\n## 💭 Onze kijk\n\n{opinion}"
