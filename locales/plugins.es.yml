# Broadcast plugins: plugin screens, permissions and emails, Spanish.
#
# Every key mirrors reference/plugins.en.yml. Keep each %{placeholder} as it is,
# keep the HTML in keys ending in _html, and never use long dashes. Follow the
# style notes and glossary at the top of admin.es.yml. bin/check validates the
# file; see CONTRIBUTING.md.
es:
  plugins:
    open_link:
      title: "¿Abrir este enlace?"
      body: "%{plugin} quiere abrir una página fuera de Broadcast. Comprueba la dirección antes de continuar."
      open: "Abrir enlace"
    editor_insert:
      close: "Cerrar"
      from: "De %{plugin}"
      cleaned: "Broadcast revisa y limpia el HTML antes de que entre en el correo."
      group: "De plugins"
      menu: "Insertar desde un plugin"
    public_action:
      confirm_title: "Un momento"
      confirm_button: "Continuar"
      saving: "Guardando…"
      done_title: "Gracias"
      failed_title: "Algo salió mal"
      failed_body: "No pudimos guardar esto. Vuelve a probar el enlace más tarde."
      test_title: "Este es un correo de prueba"
      test_body: "El enlace funciona. En el correo real, este clic se guarda para la persona que hace clic. Ahora no se guardó nada."
    developer_token:
      label: "Desarrollador de plugins"
      hint: "Para un agente de IA que escribe plugins: puede crear, cambiar y probar borradores con datos de prueba, y enviártelos para que los revises. No puede leer datos reales de suscriptores ni desplegar. No puede tener otros permisos y caduca en un plazo de 30 días."
    webhook_endpoints:
      title: "Eventos de plugins"
      hint: "Se envían solo para los eventos que marques aquí. Seleccionar todo no los incluye."
      not_available: "tiene un evento de plugin que no está disponible en este canal"
    token_endpoints:
      label: "Endpoints de plugins"
      hint: "Los endpoints de la API de plugins que este token puede llamar, uno por línea (plugin/endpoint, o plugin/* para todos). El token también necesita el permiso que pide cada endpoint."
      needs: "necesita %{permission}"
    permissions:
      settings:
        label: "Su propia configuración"
        description: "Lee la configuración que introduces para este plugin, incluidos los valores secretos."
      store:
        label: "Su propio almacenamiento"
        description: "Guarda sus propios datos en Broadcast."
      log:
        label: "Registros"
        description: "Escribe líneas de registro que puedes leer en la página del plugin."
      channel:
        label: "Nombre del canal"
        description: "Lee el nombre del canal en el que se ejecuta."
      events:
        label: "Sus propios eventos"
        description: "Registra eventos (por ejemplo, pedidos) para sus reglas de segmento."
      subscribers_read:
        label: "Leer suscriptores"
        description: "Lee los datos, etiquetas y campos personalizados de los suscriptores."
      subscribers_write:
        label: "Cambiar suscriptores"
        description: "Cambia nombres, campos personalizados y otros datos de suscriptores existentes."
      tags_read:
        label: "Leer etiquetas"
        description: "Lee la lista de etiquetas."
      tags_write:
        label: "Cambiar etiquetas"
        description: "Añade etiquetas a los suscriptores y las quita."
      broadcasts_read:
        label: "Leer campañas"
        description: "Lee las campañas y sus estadísticas."
      sequences_read:
        label: "Leer secuencias"
        description: "Lee las secuencias y sus pasos."
      segments_read:
        label: "Leer segmentos"
        description: "Lee los segmentos y sus reglas."
      templates_read:
        label: "Leer plantillas"
        description: "Lee los nombres, los asuntos y las primeras palabras de tus plantillas de correo."
      network:
        label: "Acceso a internet"
        description: "Se conecta a estos sitios: %{hosts}."
      subscribers_export:
        label: "Copiar toda tu lista"
        description: "Puede leer todos los suscriptores, página a página, y enviarlos a %{hosts}."
      subscribers_create:
        label: "Añadir suscriptores nuevos"
        description: "Añade personas a tu lista. Se aplica tu configuración de doble opt-in."
      network_wildcard:
        label: "Acceso a internet a muchos sitios"
        description: "Se conecta a cualquier sitio que coincida con %{hosts}."
      network_fromSetting:
        label: "Acceso a internet a una dirección que introduces"
        description: "Se conecta a la dirección que escribes en la opción %{setting}."
      output_html:
        label: "HTML en los correos"
        description: "Añade HTML a los correos. Broadcast lo limpia antes del envío."
      hooks_beforeSend:
        label: "Cambiar los correos antes del envío"
        description: "Puede omitir un correo o cambiar su asunto y contenido. No puede cambiar quién lo recibe, el remitente ni el enlace de baja."
      hooks_apiEndpoints:
        label: "Su propia API"
        description: "Añade direcciones de API que pueden usar quienes tengan un token de API correspondiente."
      events_webhook:
        label: "Sus eventos en webhooks"
        description: "Te permite enviar eventos de este plugin a tus endpoints de webhook. No se envía nada hasta que activas un evento para un endpoint. Un webhook contiene el evento, sus campos declarados y el id del suscriptor, nunca una dirección de correo."
      hooks_publicActions:
        label: "Enlaces en correos en los que cualquiera puede hacer clic"
        description: "Añade a los correos enlaces que ejecutan este plugin cuando un suscriptor hace clic en ellos, sin iniciar sesión. Broadcast comprueba quién hizo clic. El plugin recibe el suscriptor y la opción del enlace."
      network_private:
        label: "Acceso a una dirección privada"
        description: "Se conecta a una dirección de tu red privada que tú apruebas."
      email_sender:
        label: "Cambiar el remitente"
        description: "Cambia De o Responder a por un remitente verificado en este canal."
      sql:
        label: "Acceso a la base de datos"
      files:
        label: "Acceso a archivos"
      env:
        label: "Acceso a la configuración del servidor"
      process:
        label: "Iniciar programas"
      subscribers_resubscribe:
        label: "Volver a suscribir personas"
      suppressions_write:
        label: "Quitar exclusiones"
      email_recipients:
        label: "Cambiar los destinatarios de los correos"
      email_unsubscribe:
        label: "Cambiar el enlace de baja"
